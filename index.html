<style>
:root{
  --bg1:#2b2350; --bg2:#4b3b8f;
  --card:#ffffff; --ink:#24203a; --soft:#6d6787; --line:#e7e3f3;
  --accent:#ff7a59; --accent2:#7c5cff;
  --good:#22b573; --great:#f5b700; --meh:#9a94b3; --bad:#ff6b6b; --awful:#c0264a;
  --h:#ff6b8b; --s:#4da3ff; --j:#ffc23d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{background:#3b2f70}
body{
  font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(170deg,var(--bg1),var(--bg2));background-attachment:fixed;
  min-height:100%;
}
button{font-family:inherit;cursor:pointer}
.app{max-width:480px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:4px 2px 12px}
.logo{font-weight:700;font-size:24px;letter-spacing:.5px}
.logo small{display:block;font-weight:400;font-size:12px;opacity:.75;letter-spacing:0}
.streak{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-weight:600}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(20,10,60,.25)}
.hero{text-align:center;background:linear-gradient(180deg,#e9f5ff,#fff 70%)}
.hero svg{width:220px;height:264px;display:block;margin:0 auto}
.buddy{position:relative;width:220px;margin:0 auto;cursor:pointer;user-select:none;-webkit-user-select:none}
.buddy.hop{animation:hop .55s ease}
.buddy.droop{animation:droop .7s ease}
@keyframes hop{30%{transform:translateY(-22px) scale(1.04)}55%{transform:translateY(0) scale(1.06,.94)}75%{transform:translateY(-6px)}}
@keyframes droop{25%{transform:translateX(-6px) rotate(-3deg)}50%{transform:translateX(6px) rotate(3deg)}75%{transform:translateX(-3px)}}
.bubble{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%) scale(.6);opacity:0;pointer-events:none;
  background:#fff;color:var(--ink);border:3px solid #3b2a4a;border-radius:18px;padding:8px 12px;font-size:15px;font-weight:500;
  width:max-content;max-width:240px;line-height:1.3;transition:opacity .2s,transform .25s cubic-bezier(.2,1.4,.4,1);z-index:2}
.bubble:after{content:'';position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:#3b2a4a;border-bottom:0}
.bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
.hero{position:relative;padding-top:56px}
.taphint{font-size:12px;color:var(--accent2);font-weight:600}
.bob{animation:bob 2.4s ease-in-out infinite;transform-origin:100px 230px}
@keyframes bob{50%{transform:translateY(-4px)}}
.name{font-size:26px;font-weight:700;margin:2px 0 0}
.sub{color:var(--soft);font-size:15px;margin-top:2px}
.tag{display:inline-block;background:#f1edff;color:var(--accent2);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;margin:8px 3px 0}
.stats{margin-top:14px;text-align:left}
.stat{display:flex;align-items:center;gap:10px;margin:8px 0}
.stat .lbl{width:92px;font-size:14px;font-weight:500}
.bar{flex:1;height:12px;background:#f0eef7;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .8s ease}
.stat .num{width:28px;text-align:right;font-size:13px;color:var(--soft)}
h2{font-size:19px;margin:0 0 6px}
p{margin:6px 0;line-height:1.4}
.muted{color:var(--soft);font-size:14px}
.row{display:flex;gap:10px}
.field{flex:1}
label{font-size:13px;color:var(--soft);font-weight:500;display:block;margin-bottom:4px}
select,input[type=text]{
  width:100%;font-family:inherit;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);
}

.btn.alt{background:linear-gradient(135deg,var(--accent2),#5b3fe0);box-shadow:0 6px 0 #4127b0}
.btn.ghost{background:#f1edff;color:var(--accent2);box-shadow:none}
.btn.danger{background:#fff0f0;color:var(--awful);box-shadow:none}

summary{cursor:pointer;font-weight:500;color:var(--accent2)}
details ul{padding-left:18px;margin:6px 0}
.goalnote{display:flex;justify-content:space-between;font-size:14px;color:var(--soft);margin-bottom:10px}
.waiting{text-align:center}

.countdown{font-size:28px;font-weight:700;color:var(--accent2)}

.nav button{flex:1;border:0;background:none;font-size:13px;color:var(--soft);padding:4px;font-weight:500}
.nav button b{display:block;font-size:22px}
.nav button.on{color:var(--accent2)}

.year:last-child{border-bottom:0}
.year .age{width:44px;flex:none;text-align:center;font-weight:700;color:var(--soft);font-size:13px}
.year .age b{display:block;font-size:26px;line-height:1.1}
.year .what{flex:1}

.year .what .m{font-size:13px;color:var(--soft);margin-top:3px}

.ms{background:#fff8e1;border-radius:14px;padding:10px 12px;margin-top:8px}

@keyframes fade{from{opacity:0}}

.agebig{font-size:15px;color:var(--soft);font-weight:600}

.evt{font-size:52px;margin:6px 0 0}
.evtxt{font-size:19px;font-weight:500;margin:6px 0 10px}
.fx{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0}

.goalval{font-size:34px;font-weight:700;color:var(--accent2);text-align:center}

.intro p{font-size:18px;opacity:.9}
.setuptop{display:flex;align-items:center;gap:10px;color:#fff;margin:4px 0 12px;min-height:34px}

.center{text-align:center}
h2.big{font-size:24px;margin:6px 0 14px}
h2.sm{font-size:15px;color:var(--soft);margin:14px 0 8px}
.center .swatches{justify-content:center}
.bigprev svg{width:190px;height:228px;display:block;margin:0 auto}
.futures{text-align:center}

.future.down{background:linear-gradient(180deg,#e4e4ea,#f6f6f8)}
.future svg{width:100%;height:auto;display:block}
.future b{display:block;font-size:15px}
.future span{display:block;font-size:12px;color:var(--soft);line-height:1.3;margin-top:2px}
.goalbox{background:#f5f2ff;border-radius:18px;padding:12px;margin-top:14px;text-align:center}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}

.saved{font-size:15px;margin-top:6px}
.btn.promise{font-size:17px;line-height:1.3}
.birth svg{width:170px;height:204px;display:block;margin:0 auto}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.switch input{width:22px;height:22px;accent-color:var(--accent2)}
.confetti{position:fixed;top:-20px;font-size:22px;pointer-events:none;z-index:30;animation:drop linear forwards}
@keyframes drop{to{transform:translateY(110vh) rotate(540deg)}}
.hide{display:none!important}

</head>

// ============ GAME STATE ============
const KEY = 'lifetime-v1';
const SKINS = ['#ffe0c7','#f1c27d','#d9a066','#a86b3c','#6b4226'];
const HAIRS = ['#2b1d14','#6a3e1f','#d8a24a','#c0392b','#3d3d8f'];
let S = load();
let tab = 'home';
let draft = {name:'', skin:SKINS[1], hair:HAIRS[0], avg:240, goal:210, step:0};

function load(){ try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

function newLife(name, skin, hair, goal, gen, bonus){
  const b = bonus || 0;
  return {
    name, skin, hair, goal, gen: gen || 1,
    age: 0, h: 50 + b, s: 50 + b, j: 50 + b, money: 0,
    streak: 0, best: 0, edu: null, eduTier: 0, job: null, pay: 0, talent: null, partner: null,
    used: [], log: [], lastDate: null, testMode: S ? S.testMode : false, done: false
  };
}

function stage(age){
  if (age < 5) return 'baby';
  if (age < 13) return 'kid';
  if (age < 14) return 'middle';
  if (age < 18) return 'teen';
  if (age < 23) return 'young';
  if (age < 65) return 'adult';
  return 'senior';
}
const STAGE_NAMES = {baby:'Baby', kid:'Kid', middle:'Teenager', teen:'Teenager', young:'Young adult', adult:'Adult', senior:'Golden years'};

// A day runs from 4am to 4am, so a check-in just after midnight still counts for the night before.
function today(){ const d = new Date(Date.now() - 4*3600e3); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dayNum(key){ const [y,m,d] = key.split('-').map(Number); return Math.round(Date.UTC(y, m-1, d) / 864e5); }
function dayKey(n){ const d = new Date(n * 864e5); return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate(); }
function canCheckIn(){ return S.testMode || S.lastDate !== today(); }
function clamp(v){ return Math.max(0, Math.min(100, Math.round(v))); }
function fmtTime(m){ const h = Math.floor(m/60), mm = m%60; return h ? (mm ? h+'h '+mm+'m' : h+'h') : mm+'m'; }
function fmtMoney(k){ if (k >= 1000) return '$'+(k/1000).toFixed(k >= 10000 ? 0 : 1)+'M'; return '$'+Math.round(k)+'K'; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ============ ONE YEAR PASSES ============
function checkIn(mins){
  const g = S.goal;
  let tier;
  if (mins <= g * SETTINGS.greatIfUnder) tier = 'great';
  else if (mins <= g) tier = 'good';
  else if (mins <= g * SETTINGS.mehIfOver) tier = 'meh';
  else if (mins <= g * SETTINGS.awfulIfOver) tier = 'bad';
  else tier = 'awful';
  const entry = liveYear(mins, tier);
  S.lastDate = today();
  save();
  render();
  showYear(entry);
}

// One year of the character's life. tier 'skipped' means a day you didn't check in.
function liveYear(mins, tier){
  const g = S.goal;
  const met = tier === 'great' || tier === 'good';

  S.age++;
  const st = stage(S.age);
  const pool = EVENTS[st][met ? 'good' : 'bad'];
  let fresh = pool.filter(e => !S.used.includes(e[1]));
  // Every stage has at least one event per year it lasts, so nothing repeats in a lifetime.
  // (Safety net only: if a pool ever runs dry, allow repeats from it.)
  if (!fresh.length) { S.used = S.used.filter(t => !pool.some(e => e[1] === t)); fresh = pool; }
  const ev = pick(fresh);
  S.used.push(ev[1]);

  const mult = {great:1.5, good:1, meh:0.75, bad:1.5, skipped:1.5, awful:2}[tier];
  const fx = {};
  for (const k in ev[2]) fx[k] = Math.round(ev[2][k] * mult);
  if (S.age > 60) fx.h = (fx.h || 0) - 1; // getting older

  const notes = [];
  if (tier === 'skipped') notes.push(pick(SKIP_LINES).replace('{name}', S.name));
  let streakBonus = 0;
  if (met) {
    S.streak++;
    S.best = Math.max(S.best, S.streak);
    const bonus = SETTINGS.streakBonuses[S.streak];
    if (bonus) {
      streakBonus = bonus;
      notes.push('🔥 '+S.streak+' day streak! +'+bonus+' to everything.');
    }
  } else {
    if (S.streak >= 3) notes.push('💔 Your '+S.streak+' day streak ended.');
    S.streak = 0;
  }
  const shown = applyFx(fx);
  // Gains shrink near 100; flag it so the year card can explain the smaller numbers.
  const shrunk = Object.keys(fx).some(k => fx[k] > 0 && shown[k] < fx[k]);
  // The streak bonus always adds its full amount (only capped at 100).
  for (const k of ['h','s','j']) {
    if (!streakBonus) break;
    const before = S[k];
    S[k] = clamp(S[k] + streakBonus);
    shown[k] = (shown[k] || 0) + (S[k] - before);
  }

  let earned = 0;
  // Good years add to savings. Bad years eat into them (impulse buys, missed work, late fees).
  if (met) { if (S.pay > 0) earned = Math.round(S.pay * 0.3); }
  else earned = -Math.min(S.money, Math.round(Math.max(S.pay * 0.2, S.money * 0.03)));
  S.money += earned;

  const ms = milestone(S.age, met);
  if (ms && ms.fx) applyFx(ms.fx);

  const entry = {age:S.age, date:today(), mins, goal:g, tier, emoji:ev[0], text:ev[1], fx: shown, shrunk, earned, notes, ms: ms ? {emoji:ms.emoji, title:ms.title, text:ms.text} : null};
  S.log.push(entry);
  if (S.age >= SETTINGS.lifeLength) S.done = true;
  return entry;
}

// ============ SKIPPED DAYS ============
const SKIP_LINES = [
  '👻 You weren\'t around. {name} spent the year glued to the couch.',
  '👻 No check-in. {name} wandered through the year on autopilot.',
  '👻 You disappeared, so {name} picked up their phone instead.',
  '👻 {name} waited for you all year. You never came.'
];
// Each full day without a check-in is a rough year lived without you (at most a few per break).
function catchUp(){
  if (!S || S.done || S.testMode || !S.lastDate) return;
  const missed = dayNum(today()) - dayNum(S.lastDate) - 1;
  if (missed < 1) return;
  const years = Math.min(missed, SETTINGS.maxSkippedYears);
  const entries = [];
  for (let i = 0; i < years && !S.done; i++) entries.push(liveYear(null, 'skipped'));
  S.lastDate = dayKey(dayNum(today()) - 1);   // today's check-in is still open
  save();
  render();
  let h = '<div class="banner" style="background:var(--meh)">👻 You were away</div>'+
    '<h2>You missed '+missed+' day'+(missed > 1 ? 's' : '')+'</h2>'+
    '<p>'+esc(S.name)+' lived '+entries.length+' year'+(entries.length > 1 ? 's' : '')+' without you'+(missed > years ? ' (never more than '+years+' per break)' : '')+'.</p>';
  for (const e of entries) {
    h += '<div class="year" style="text-align:left"><div class="age"><b>'+e.age+'</b>age</div><div class="what"><div class="t">'+e.emoji+' '+esc(e.text)+'</div>'+
      '<div class="fx" style="justify-content:flex-start">'+fxHTML(e.fx, e.earned)+'</div>'+
      (e.ms ? '<div class="ms"><b>'+e.ms.emoji+' '+esc(e.ms.title)+'</b><br><span class="muted">'+esc(e.ms.text)+'</span></div>' : '')+'</div></div>';
  }
  h += '<p class="muted">Check in every day so you don\'t miss their life.</p><button class="btn" data-close>'+(S.done ? 'See how their life went' : 'Check in for today')+'</button>';
  modal(h);
}

// Gains shrink as a stat nears 100, so it takes steady good days to stay on top.
function applyFx(fx){
  const real = {};
  for (const k in fx) {
    let v = fx[k];
    if (v > 0 && k !== 'money') v = Math.max(1, Math.round(v * Math.min(1, (100 - S[k]) / 50)));
    const before = S[k];
    S[k] = clamp(S[k] + v);
    real[k] = S[k] - before;
  }
  return real;
}

function milestone(age, met){
  const avg = (S.h + S.s + S.j) / 3;

    ? {emoji:'🎒', title:'First day of school', text:'Walked in like they owned the place. Made three friends by lunch.', fx:{j:4}}
    : {emoji:'🎒', title:'First day of school', text:'Cried at the door for twenty minutes. Eventually made one friend.', fx:{j:-3}};

    const top = [['h',S.h],['s',S.s],['j',S.j]].sort((a,b) => b[1]-a[1])[0][0];

      h:{emoji:'⚡', title:'Talent discovered: Sports', text:'Fastest kid in the whole school. Coaches are already asking about them.'},
      s:{emoji:'🤖', title:'Talent discovered: Science', text:'Built a working robot out of an old vacuum cleaner.'},

function lifeScore(){
  const avg = (S.h + S.s + S.j) / 3;
  const metDays = S.log.filter(e => e.tier === 'good' || e.tier === 'great').length;

  if (score >= 70) return ['😊','A pretty good life'];
  if (score >= 45) return ['😐','A so-so life'];
  return ['🥔','A couch potato life'];
}

// ============ CHARACTER DRAWING ============
// Big-eyed cartoon style. Looks happy after a good year and tired, phone in hand, after a missed one.
function charSVG(c){
  const st = stage(c.age);
  const last = c.log && c.log.length ? c.log[c.log.length-1] : null;
  const sad = (last && !(last.tier === 'good' || last.tier === 'great')) || c.j < 30;
  const O = '#3b2a4a', W = 'stroke="'+O+'" stroke-width="3.5"';
  const sc = {baby:.62, kid:.8, middle:.86, teen:.92, young:.97, adult:1, senior:.95}[st];
  const hair = st === 'senior' ? '#e9e7ef' : c.hair;
  const dressy = (st === 'adult' && c.job && c.pay >= 60);
  let shirt = {baby:'#ffd36e', kid:'#ffb627', middle:'#00bbf9', teen:'#7b61ff', young:'#f15bb5', adult: dressy ? '#2f3e6e' : '#2a9d8f', senior:'#e07a5f'}[st];
  if (sad) shirt = '#9a98a6';
  const pants = dressy && !sad ? '#232a45' : '#4a6fa5';
  const bodyX = c.h < 35 ? 62 : 68, bodyW = c.h < 35 ? 76 : 64;   // unhealthy = rounder
  const arm = 13 + c.h/25;                                          // stronger = thicker arms
  let g = '', b = '';

  // background mood: warm glow or a little rain cloud
  if (!sad) g += '<circle cx="100" cy="122" r="86" fill="#fff6c9" opacity=".75"/>';
  else g += '<g><ellipse cx="146" cy="26" rx="26" ry="14" fill="#a9b0bb"/><ellipse cx="124" cy="30" rx="18" ry="11" fill="#a9b0bb"/><path d="M128 44 l-3 8 M142 44 l-3 8 M156 44 l-3 8" stroke="#5aa9ff" stroke-width="3" stroke-linecap="round"/></g>';
  g += '<ellipse cx="100" cy="230" rx="'+(46*sc)+'" ry="7" fill="rgba(0,0,0,.12)"/>';

  b += '<g transform="translate(100 230) scale('+sc+') translate(-100 -230)">';
  // long hair hangs behind the shoulders
  if (c.girl && ['teen','young','adult'].includes(st)) b += '<path d="M50 84 Q46 38 100 34 Q154 38 150 84 L156 146 Q128 154 100 152 Q72 154 44 146Z" fill="'+hair+'" '+W+' stroke-linejoin="round"'+(sad ? ' transform="rotate(8 100 90)"' : '')+'/>';

  else {
    if (c.girl) b += '<path d="M52 88 Q46 30 100 30 Q154 30 148 88 Q146 64 134 54 Q112 66 80 52 Q64 62 52 88Z" fill="'+hair+'" '+W+' stroke-linejoin="round"/><path d="M80 40 Q96 34 112 38" stroke="#fff" stroke-width="3" opacity=".45" fill="none" stroke-linecap="round"/>';
    else b += '<path d="M52 86 Q48 30 100 30 Q152 30 148 86 Q140 60 124 56 Q116 68 98 60 Q82 70 70 58 Q58 66 52 86Z" fill="'+hair+'" '+W+' stroke-linejoin="round"/>';

    else if (st === 'teen' || st === 'middle') b += '<path d="M70 40 Q110 20 140 60 Q118 44 96 48Z" fill="'+hair+'" stroke="'+O+'" stroke-width="3"/><path d="M84 40 Q100 34 116 38" stroke="#fff" stroke-width="3" opacity=".5" fill="none"/>';

    if (sad) b += '<path d="M70 34 l-6 -8 M128 34 l8 -8 M100 28 l0 -10" stroke="'+O+'" stroke-width="3" stroke-linecap="round"/>';

  // face

    b += '<ellipse cx="70" cy="106" rx="8" ry="5" fill="#ff8fa3" opacity=".6"/><ellipse cx="130" cy="106" rx="8" ry="5" fill="#ff8fa3" opacity=".6"/>';

const STREAK_LINES = ['{n} days in a row! I\'ve never felt this good.', 'Our streak is at {n}! Don\'t stop now!', '{n} day streak! We make a great team.'];
const TICKLE_LINES = ['Okay okay, I\'m awake!', 'That tickles! 😆', 'Hey! Personal space!', 'Stop poking me! ...Okay, one more.'];

let taps = [], bubbleTimer;
function tapCharacter(){
  const wrap = $('buddy');
  if (!wrap) return;
  const now = Date.now();
  taps = taps.filter(t => now - t < 3000); taps.push(now);
  const st = stage(S.age);
  const last = S.log.length ? S.log[S.log.length-1] : null;
  const up = !(last && !(last.tier === 'good' || last.tier === 'great')) && S.j >= 30;
  let line;
  if (taps.length >= 5) line = pick(TICKLE_LINES);
  else if (up && S.streak >= 3 && Math.random() < 0.3) line = pick(STREAK_LINES).replace('{n}', S.streak);
  else line = pick(LINES[st][up ? 'up' : 'down']);
  wrap.classList.remove('hop', 'droop'); void wrap.offsetWidth;
  wrap.classList.add(up ? 'hop' : 'droop');
  const bub = $('bubble');
  bub.textContent = line;
  bub.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bub.classList.remove('show'), 3200);
  if (!S.tapped) { S.tapped = true; save(); const h = $('taphint'); if (h) h.remove(); }
}

// ============ SCREENS ============
const $ = id => document.getElementById(id);
function render(){
  const app = $('app');
  if (!S) { $('nav').classList.add('hide'); app.innerHTML = setupHTML(); bindSetup(); return; }
  $('nav').classList.remove('hide');
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'home') app.innerHTML = homeHTML();
  else if (tab === 'story') app.innerHTML = storyHTML();
  else app.innerHTML = settingsHTML();
  bind();
}

function header(){
  return '<div class="top"><div class="logo">Lifetime<small>One day for you. One year for them.</small></div>'+
    '<div class="streak">🔥 '+S.streak+'</div></div>';
}

function statRow(lbl, v, color){
  return '<div class="stat"><span class="lbl">'+lbl+'</span><div class="bar"><i style="width:'+v+'%;background:'+color+'"></i></div><span class="num">'+v+'</span></div>';
}

function homeHTML(){
  const st = stage(S.age);

  if (S.job) tags += '<span class="tag">💼 '+S.job+'</span>';
  if (S.partner) tags += '<span class="tag">💞 '+S.partner+'</span>';
  if (S.money > 0) tags += '<span class="tag">💰 '+fmtMoney(S.money)+'</span>';

  let action;
  if (S.done) {
    const sc = lifeScore(), t = lifeTitle(sc);
    action = '<div class="card waiting"><div class="big">'+t[0]+'</div><h2>'+S.name+' lived '+t[1].toLowerCase()+'</h2>'+
      '<p class="muted">Life score: <b>'+sc+'</b>. You hit your goal on '+S.log.filter(e=>e.tier==='good'||e.tier==='great').length+' of '+S.log.length+' days.</p>'+
      '<p>'+S.name+' has passed the torch. Keep going as their kid, who gets a head start from the life you built.</p>'+
      '<button class="btn alt" id="nextGen">Play as '+S.name+'\'s kid</button></div>';
  } else if (canCheckIn()) {
    action = '<div class="card"><h2>'+(S.age === 0 ? 'Ready for year one?' : 'How was your screen time today?')+'</h2>'+
      '<div class="goalnote"><span>Your goal: '+fmtTime(S.goal)+' or less</span><span>Best streak: '+S.best+'</span></div>'+
      '<div class="row"><div class="field"><label>Hours</label><select id="hrs">'+opts(0,16,1,'')+'</select></div>'+
      '<div class="field"><label>Minutes</label><select id="mins">'+opts(0,55,5,'')+'</select></div></div>'+
      '<button class="btn" id="go">Live year '+(S.age+1)+' ➜</button>'+
      '<details><summary>Where do I find my screen time?</summary><ul>'+
      '<li><b>iPhone:</b> Settings → Screen Time → See All App &amp; Website Activity. Use the number for Today.</li>'+
      '<li><b>Android:</b> Settings → Digital Wellbeing &amp; parental controls. The number in the circle is today.</li>'+
      '</ul>Best time to check in is right before bed.</details></div>';
  } else {
    action = '<div class="card waiting"><div class="big">🌙</div><h2>'+S.name+' is living out age '+S.age+'</h2>'+

}

function opts(a,b,step,sel){ let o=''; for (let i=a;i<=b;i+=step) o+='<option value="'+i+'">'+i+'</option>'; return o; }
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const TIER = {
  great:{label:'🌟 Amazing year!', color:'var(--great)'},
  skipped:{label:'👻 Skipped year', color:'#6d6787'},
  good:{label:'✅ Good year', color:'var(--good)'},
  meh:{label:'😐 So-so year', color:'var(--meh)'},
  bad:{label:'⚠️ Rough year', color:'var(--bad)'},
  awful:{label:'💥 Disaster year', color:'var(--awful)'}
};

function fxHTML(fx, earned){
  const names = {h:'💪', s:'🧠', j:'😊'};
  let out = '';
  for (const k of ['h','s','j']) if (fx[k]) out += '<span class="'+(fx[k]<0?'neg':'')+'">'+(fx[k]>0?'+':'')+fx[k]+' '+names[k]+'</span>';
  if (earned > 0) out += '<span>+'+fmtMoney(earned)+' saved 💰</span>';
  if (earned < 0) out += '<span class="neg">-'+fmtMoney(-earned)+' savings 💸</span>';
  return out;
}

function storyHTML(){
  if (!S.log.length) return header()+'<div class="card"><h2>Life story</h2><p class="muted">'+esc(S.name)+'\'s story starts after your first check-in.</p></div>';

  for (let i = S.log.length-1; i >= 0; i--) {
    const e = S.log[i], t = TIER[e.tier];
    rows += '<div class="year"><div class="age"><b>'+e.age+'</b>age</div><div class="what">'+
      '<div class="t">'+e.emoji+' '+esc(e.text)+'</div>'+

      '</div></div>';

  return header()+'<div class="card"><h2>'+esc(S.name)+'\'s life story</h2><p class="muted">Goal met on '+met+' of '+S.log.length+' days.</p>'+rows+'</div>';
}

    '<div class="card"><h2>Daily goal</h2><p class="muted">Stay at or under this much phone time each day.</p>'+
    '<div class="goalval" id="gv">'+fmtTime(S.goal)+'</div><input type="range" id="goal" min="15" max="720" step="15" value="'+S.goal+'"></div>'+
    '<div class="card"><h2>Name</h2><input type="text" id="nm" maxlength="20" value="'+esc(S.name)+'"></div>'+
    '<div class="card"><h2>Testing</h2><div class="switch"><span>Let me check in more than once a day (for trying the game out)</span><input type="checkbox" id="tm" '+(S.testMode?'checked':'')+'></div></div>'+
    '<div class="card"><h2>Start over</h2><p class="muted">Erases '+esc(S.name)+' and their whole life story.</p><button class="btn danger" id="reset">Start a brand new life</button></div>';
}

// ============ SETUP (one step at a time) ============
// Steps: 0 two futures, 1 boy or girl, 2 name, 3 look, 4 goal, 5 promise
const SETUP_STEPS = 6;
function previewSVG(age, extra){
  return charSVG(Object.assign({name: draft.name || 'them', age, log: [], h: 60, s: 50, j: 70, skin: draft.skin, hair: draft.hair, girl: !!draft.girl}, extra || {}));
}
function setupHTML(){
  const step = draft.step || 0, name = esc(draft.name || 'them');
  const dots = '<div class="dots">'+Array.from({length: SETUP_STEPS}, (_, i) => '<i class="'+(i <= step ? 'on' : '')+'"></i>').join('')+'</div>';
  const back = step > 0 ? '<button class="backbtn" id="back">‹ Back</button>' : '';
  const top = '<div class="setuptop">'+back+dots+'</div>';
  if (step === 0) {
    const nextGen = draft.gen > 1;
    return '<div class="intro"><h1>Lifetime</h1><p>One day for you is one year for them.</p></div>'+
      '<div class="card futures"><div class="row">'+
        '<div class="future up">'+previewSVG(30, {job:'Doctor', pay:200, log:[{tier:'good'}], j:90})+'<b>2 hours a day</b><span>Doctor, marathon runner, happy</span></div>'+
        '<div class="future down">'+previewSVG(30, {log:[{tier:'awful'}], j:20})+'<b>7 hours a day</b><span>Tired, broke, glued to the couch</span></div>'+
      '</div><h2>Which life will they live?</h2><p class="muted">Every day you hit your screen time goal, your little person has a great year. Every day you miss it... less great. '+(nextGen ? 'Time to raise the next generation.' : 'It\'s up to you.')+'</p>'+
      '<button class="btn" id="next">'+(nextGen ? 'Meet the next generation' : 'Meet your little person')+' →</button></div>';
  }
  if (step === 1) return top+'<div class="card"><h2 class="big">Boy or girl?</h2><div class="row">'+[false,true].map(g=>'<button class="pick'+(draft.girl === g ? ' on' : '')+'" data-girl="'+g+'">'+
      charSVG({name:g?'Girl':'Boy', age:8, log:[], h:60, s:50, j:70, skin:draft.skin, hair:draft.hair, girl:g})+(g?'Girl':'Boy')+'</button>').join('')+'</div></div>';
  if (step === 2) return top+'<div class="card center"><div class="bigprev">'+previewSVG(8)+'</div><h2 class="big">What\'s their name?</h2>'+
      '<input type="text" id="nm" maxlength="20" placeholder="Their name" value="'+esc(draft.name)+'" autocomplete="off"><button class="btn alt" id="next">Next →</button></div>';
  if (step === 3) return top+'<div class="card center"><div class="bigprev">'+previewSVG(8)+'</div><h2 class="big">How does '+name+' look?</h2>'+
      '<h2 class="sm">Skin</h2><div class="swatches">'+SKINS.map(c=>'<button class="sw'+(c===draft.skin?' on':'')+'" data-skin="'+c+'" style="background:'+c+'" aria-label="skin color"></button>').join('')+'</div>'+
      '<h2 class="sm">Hair</h2><div class="swatches">'+HAIRS.map(c=>'<button class="sw'+(c===draft.hair?' on':'')+'" data-hair="'+c+'" style="background:'+c+'" aria-label="hair color"></button>').join('')+'</div>'+
      '<button class="btn alt" id="next">Next →</button></div>';
  if (step === 4) return top+'<div class="card"><h2 class="big">How much screen time do you average a day?</h2>'+
      '<div class="goalval" id="av">'+fmtTime(draft.avg)+'</div><input type="range" id="avg" min="30" max="720" step="15" value="'+draft.avg+'">'+
      '<details><summary>Where do I find this?</summary><ul><li><b>iPhone:</b> Settings → Screen Time. It shows your Daily Average.</li><li><b>Android:</b> Settings → Digital Wellbeing &amp; parental controls.</li></ul></details>'+
      '<div class="goalbox"><div class="muted">Your daily goal</div><div class="stepper"><button id="minus">–</button><div class="goalval" id="gv">'+fmtTime(draft.goal)+'</div><button id="plus">+</button></div>'+
      '<div id="saved" class="saved">'+savedLine()+'</div></div>'+
      '<button class="btn alt" id="next">Next →</button></div>';
  return top+'<div class="card center"><div class="bigprev">'+previewSVG(0)+'</div><h2 class="big">Ready to bring '+name+' to life?</h2>'+
      '<p class="muted">Check in every night with your screen time. Stay at '+fmtTime(draft.goal)+' or less and '+name+' gets a great year.</p>'+
      '<button class="btn promise" id="start">I promise to give '+name+' a good life 🤞</button></div>';
}
function savedLine(){
  const diff = draft.avg - draft.goal;
  if (diff <= 0) return 'Try a goal a little below your average. That\'s where the magic happens.';
  const hrs = Math.round(diff * 365 / 60);
  return 'That\'s <b>'+hrs+' hours a year</b> back, about <b>'+Math.round(hrs/24)+' full days</b>.';
}
function goStep(n){ draft.step = Math.max(0, Math.min(SETUP_STEPS - 1, n)); render(); window.scrollTo(0, 0); }

function bindSetup(){
  const step = draft.step || 0;
  if ($('back')) $('back').onclick = () => goStep(step - 1);
  document.querySelectorAll('[data-girl]').forEach(b => b.onclick = () => { draft.girl = b.dataset.girl === 'true'; render(); setTimeout(() => goStep(2), 250); });
  document.querySelectorAll('[data-skin]').forEach(b => b.onclick = () => { draft.skin = b.dataset.skin; render(); });
  document.querySelectorAll('[data-hair]').forEach(b => b.onclick = () => { draft.hair = b.dataset.hair; render(); });
  if ($('nm')) {
    $('nm').oninput = e => { draft.name = e.target.value; };
    $('nm').onkeydown = e => { if (e.key === 'Enter') $('next').click(); };
  }
  if ($('avg')) {
    const update = () => { $('av').textContent = fmtTime(draft.avg); $('gv').textContent = fmtTime(draft.goal); $('saved').innerHTML = savedLine(); };
    $('avg').oninput = e => { draft.avg = +e.target.value; draft.goal = Math.max(15, draft.avg - 30); update(); };
    $('minus').onclick = () => { draft.goal = Math.max(15, draft.goal - 15); update(); };
    $('plus').onclick = () => { draft.goal = Math.min(720, draft.goal + 15); update(); };
  }
  if ($('next')) $('next').onclick = () => {
    if (step === 2) {
      draft.name = $('nm').value.trim();
      if (!draft.name) { $('nm').focus(); $('nm').style.borderColor = 'var(--bad)'; return; }
    }
    goStep(step + 1);
  };
  if ($('start')) $('start').onclick = () => {
    const name = draft.name.trim();
    const keepTest = draft.testMode || false;
    S = newLife(name, draft.skin, draft.hair, draft.goal, draft.gen, draft.bonus);
    S.girl = !!draft.girl;
    S.avg = draft.avg;
    S.testMode = keepTest;
    save(); tab = 'home'; render();
    modal('<div class="birth">'+charSVG(S)+'</div><h2>'+esc(name)+' is born!</h2>'+
      '<div class="firstword">"'+esc(pick(LINES.baby.up))+'"</div>'+
      '<p>Every day you hit your goal, '+esc(name)+' has a great year. Check in tonight to start year one.</p><button class="btn" data-close>Let\'s go</button>');
    confetti(['👶','🎉','✨','🍼','💖']);
  };
}

let cdTimer;
function bind(){
  clearInterval(cdTimer);
  if ($('buddy')) $('buddy').onclick = tapCharacter;
  if ($('go')) $('go').onclick = () => checkIn((+$('hrs').value)*60 + (+$('mins').value));
  if ($('cd')) { const tick = () => { const n = new Date(), m = new Date(n); m.setHours(4,0,0,0); if (m <= n) m.setDate(m.getDate()+1); const s = Math.floor((m-n)/1000);
      $('cd') && ($('cd').textContent = String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'));
      if (s <= 0) render(); }; tick(); cdTimer = setInterval(tick, 1000); }
  if ($('goal')) $('goal').oninput = e => { S.goal = +e.target.value; $('gv').textContent = fmtTime(S.goal); save(); };
  if ($('nm')) $('nm').onchange = e => { const v = e.target.value.trim(); if (v) { S.name = v; save(); } };
  if ($('tm')) $('tm').onchange = e => { S.testMode = e.target.checked; save(); };
  if ($('reset')) $('reset').onclick = () => {
    if (!confirm('Erase '+S.name+' and start a new life?')) return;
    draft = {name:'', skin:S.skin, hair:S.hair, girl:S.girl, avg:S.avg || S.goal + 30, goal:S.goal, step:0, testMode:S.testMode};
    S = null; save(); try { localStorage.removeItem(KEY); } catch(e){}
    render();
  };
  if ($('nextGen')) $('nextGen').onclick = () => {
    const bonus = Math.min(15, Math.round(lifeScore()/10));
    draft = {name:'', skin:S.skin, hair:S.hair, girl:S.girl, avg:S.avg || S.goal + 30, goal:S.goal, gen:S.gen+1, bonus, step:0, testMode:S.testMode};
    S = null; try { localStorage.removeItem(KEY); } catch(e){}
    render();
  };
}

function showYear(e){
  const t = TIER[e.tier];
  let h = '<div class="banner" style="background:'+t.color+'">'+t.label+'</div>'+
    '<div class="agebig">'+esc(S.name)+' is now<b>'+e.age+'</b></div>'+
    '<p class="muted">'+fmtTime(e.mins)+' of screen time vs. your '+fmtTime(e.goal)+' goal</p>'+
    '<div class="evt">'+e.emoji+'</div><div class="evtxt">'+esc(e.text)+'</div>'+
    '<div class="fx">'+fxHTML(e.fx, e.earned)+'</div>'+
    (e.shrunk ? '<p class="muted">⭐ Already near the top! Keep it up to stay there.</p>' : '');
  for (const n of e.notes) h += '<p><b>'+n+'</b></p>';
  if (e.ms) h += '<div class="mscard"><div class="k">Big life moment</div><div class="e">'+e.ms.emoji+'</div><div class="t">'+esc(e.ms.title)+'</div><p>'+esc(e.ms.text)+'</p></div>';
  if (S.done) h += '<div class="mscard"><div class="k">The end of an era</div><div class="e">🎂</div><div class="t">'+esc(S.name)+' turned '+SETTINGS.lifeLength+'!</div><p>Their story is complete. See how it went on the Today screen.</p></div>';
  h += '<button class="btn" data-close>Continue</button>';
  modal(h);
  if (e.tier === 'great' || e.ms) confetti(e.tier === 'great' ? ['🎉','⭐','✨','🎊'] : [e.ms.emoji,'✨']);
}

function modal(inner){
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<div class="card">'+inner+'</div>';
  m.onclick = ev => { if (ev.target === m || ev.target.hasAttribute('data-close')) m.remove(); };
  document.body.appendChild(m);
}

function confetti(set){
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = pick(set);
    c.style.left = Math.random()*100 + 'vw';
    c.style.animationDuration = (1.8 + Math.random()*1.6) + 's';
    c.style.animationDelay = Math.random()*0.5 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

document.querySelectorAll('.nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0,0); });
catchUp();
render();
// If the app sat open overnight, catch up when it comes back on screen.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S) { catchUp(); render(); } });
</script>
</body>
</html>
