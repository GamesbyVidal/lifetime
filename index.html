<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{background:#3b2f70}

}
button{font-family:inherit;cursor:pointer}
.app{max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:4px 2px 12px}

.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(20,10,60,.25)}
.hero{text-align:center;background:linear-gradient(180deg,#e9f5ff,#fff 70%)}

.bubble{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%) scale(.6);opacity:0;pointer-events:none;

.hero{position:relative;padding-top:56px}

h2{font-size:19px;margin:0 0 6px}

.row{display:flex;gap:10px}

select,input[type=text]{

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;

@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.8);opacity:0}}

.agebig{font-size:15px;color:var(--soft);font-weight:600}

.mscard{background:linear-gradient(135deg,#fff4cc,#ffe3ec);border-radius:16px;padding:12px;margin-top:12px}

.swatches{display:flex;gap:10px;flex-wrap:wrap}

.pick{flex:1;border:3px solid var(--line);background:#fff;border-radius:18px;padding:6px 6px 10px;font-family:inherit;font-size:17px;font-weight:600;color:var(--ink)}

.pick.on{border-color:var(--accent2);background:#f5f2ff}
.goalval{font-size:34px;font-weight:700;color:var(--accent2);text-align:center}
input[type=range]{width:100%;accent-color:var(--accent2);height:30px}
.intro h1{position:relative}.intro h1 svg.blogo{width:290px;max-width:80%;display:block;margin:-6px auto -18px}.intro .subname{position:relative;z-index:1;margin-top:6px}.intro .subname svg{width:230px;display:block;margin:0 auto}
.logo{position:relative}.logo svg.blogo{width:118px;display:block;margin:-12px 0 -6px -6px}.top{align-items:flex-start}
svg.blogo{cursor:pointer;overflow:visible}svg.blogo .lb{animation:peek 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}svg.blogo .lb.hop{animation:bhop .6s ease}

function load(){ try { const raw = localStorage.getItem(KEY); return raw ? migrate(JSON.parse(raw)) : null; } catch(e){ return null; } }
// Renames that older saves need. Age-22 "Video game designer" became "Toy designer" (Blips don't use screens in good scenes).
function migrate(o){
  if (!o) return o;
  const toy = t => String(t).replace(/Video game designer/g, 'Toy designer').replace(/video game designer/g, 'toy designer');
  if (o.job) o.job = toy(o.job);
  if (o.log) for (const e of o.log) { if (e.text) e.text = toy(e.text); if (e.ms && e.ms.text) e.ms.text = toy(e.ms.text); }
  // One-time repair (TestFlight build 21 counted idle time, e.g. 12h 30m for a real 1h 10m; iOS phantom bursts later). Years judged from those
  // impossible numbers become quiet years: their stat and money changes are undone and the streak is rebuilt.
  // Run again in build 24 for the Nov 12 phantom burst (15h 40m for a real 4h 37m).
  if (o.log && !o.fix24) {
    o.fix21 = o.fix24 = true;
    const badDay = e => e.src === 'st' && e.mins >= 600 && e.date && dayNum(e.date) >= dayNum('2026-11-7');
    for (const e of o.log) if (badDay(e)) {
      for (const k of ['h','s','j']) if (e.fx && e.fx[k]) o[k] = Math.max(0, Math.min(100, (o[k] || 0) - e.fx[k]));
      if (e.earned) o.money = (o.money || 0) - e.earned;
      e.tier = 'quiet'; e.mins = null; e.fx = {}; e.earned = 0; e.emoji = '🌙';
      e.text = 'A quiet year. Blip miscounted this day, so it doesn\'t count.';
      e.notes = (e.notes || []).filter(n => !/streak/i.test(n));
    }
    let st = 0;
    for (let i = o.log.length - 1; i >= 0; i--) { const t = o.log[i].tier; if (t === 'quiet') continue; if (t === 'great' || t === 'good') st++; else break; }
    if (st > (o.streak || 0)) { o.streak = st; o.best = Math.max(o.best || 0, st); }
  }
  return o;
}

// The same file runs as the website and inside the phone app (see app/README.md).
// In the app, iPhone can clear website-style storage, so the save is also kept in the app's own storage.
const IS_APP = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const WEB_URL = 'https://gamesbyvidal.github.io/lifetime/';
// The page has no bundler, so @capacitor/core's registerPlugin isn't loaded. Talk to native plugins
// through the bridge iOS injects (nativePromise / nativeCallback), which every Capacitor app has.
function nativePlugin(name){
  const C = window.Capacitor;
  if (!IS_APP || !C) return null;
  if (C.registerPlugin) return C.registerPlugin(name);
  if (!C.nativePromise) return (C.Plugins && C.Plugins[name]) || null;
  nativePlugin.cache = nativePlugin.cache || {};
  return nativePlugin.cache[name] = nativePlugin.cache[name] || new Proxy({}, {get: (_, m) =>
    m === 'then' ? undefined :
    m === 'addListener' ? (ev, cb) => { C.nativeCallback(name, 'addListener', {eventName: ev}, cb); return Promise.resolve({remove(){}}); } :
    opts => C.nativePromise(name, m, opts || {})});
}
function appPrefs(){ return nativePlugin('Preferences'); }
function appBackup(){ const p = appPrefs(); if (!p) return; try { if (S) p.set({key:KEY, value:JSON.stringify(S)}); else p.remove({key:KEY}); } catch(e){} }
function appRestore(){
  const p = appPrefs(); if (!p || S) return;
  p.get({key:KEY}).then(r => { if (r && r.value && !localStorage.getItem(KEY)) { localStorage.setItem(KEY, r.value); location.reload(); } }).catch(() => {});
}

// ============ AUTOMATIC SCREEN TIME (phone app only) ============
// iPhone's Screen Time tells the app one number per day: the highest 5-minute step the day's total
// has passed (app/ios/App/App/ScreenTimePlugin.swift + BlipMonitor). It never says which apps, and it
// never leaves this phone. Apple's rules for this (see app/screen-time/README.md):
// - tracking is always free and never decides what the shop shows;
// - once any day came from Screen Time, shares, links and analytics carry only the Blip's story
//   (no goal squares, streaks, goal counts or time back);
// - if permission is denied or taken away, the game goes back to entering the number by hand.
function stPlugin(){ return stPlugin.p = stPlugin.p || nativePlugin('ScreenTime'); }
function autoOn(){ return !!(IS_APP && S && S.auto); }
// True once any of this life's numbers came from Screen Time: keeps goal results out of shares and analytics.

function stKey(n){ const [y, m, d] = dayKey(n).split('-'); return y+'-'+m.padStart(2, '0')+'-'+d.padStart(2, '0'); }
function stDayKey(){ return stKey(dayNum(today())); }
function stYestKey(){ return stKey(dayNum(today()) - 1); }
// The day the player connected only counts from that moment, so that first year can come out good or so-so, never worse.
function calKey(t){ const d = new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2, '0')+'-'+String(d.getDate()).padStart(2, '0'); }
function joinedNote(key){ return S && S.stJoined && calKey(S.stJoined) === key ? 'Counted since you joined at '+new Date(S.stJoined).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})+'.' : ''; }

function stRefresh(){
  const p = stPlugin(); if (!p || !autoOn()) return;
  p.status().then(r => {
    // Only a real "denied" turns automatic mode off. Right after launch iOS can briefly report "not determined" before it has loaded the real answer.
    if (r && (r.state ? r.state === 'denied' : !r.authorized)) { stOff('Screen Time permission was turned off, so you can enter your time yourself again.'); return; }
    const num = x => x && typeof x.minutes === 'number' ? x.minutes : null;
    return Promise.all([p.minutesFor({day: stDayKey()}), p.minutesFor({day: stYestKey()})]).then(([a, b]) => {
      const t = num(a), y = num(b);
      if (t !== stToday || y !== stYest) { stToday = t; stYest = y; if (tab === 'home') render(); }
    });
  }).catch(() => {});
}

function stResync(){

  stSyncAt = Date.now();
  p.resync().then(r => { if (r && r.resynced) [2500, 8000, 20000, 60000].forEach(ms => setTimeout(stRefresh, ms)); }).catch(() => {});

function stConnect(){

  try { p = stPlugin(); } catch(e) { stNote = 'Screen Time is not available ('+(e && e.message || e)+').'; render(); return; }

  p.authorize().then(r => {
    if (!r || !r.authorized) return fail(r && r.error ? 'Screen Time said: '+r.error+'. You can keep entering your time yourself.' : 'No problem. You can keep entering your screen time yourself, and connect any time.');

  if (autoOn()) return '<div class="card"><h2 id="sthead">📱 Automatic screen time</h2><p class="muted">On. Blip reads your day\'s total from iPhone Screen Time, rounded to 5 minutes. It never sees which apps you use, and the number never leaves your phone.</p>'+
    '<button class="btn ghost" id="stpick">Change what counts</button><button class="btn ghost" id="stoff" style="margin-top:8px">Turn off and enter it myself</button></div>';
  return '<div class="card"><h2>📱 Automatic screen time</h2><p class="muted">Skip typing it in. Blip can read your day\'s total from iPhone Screen Time. It only gets one number a day, rounded to 5 minutes, never which apps, and it stays on your phone. Free, always.</p>'+
    (stNote ? '<div class="verdict" style="background:#fff3d6;color:#6b4a00">'+esc(stNote)+'</div>' : '')+
    '<button class="btn alt" id="stgo"'+(stBusy ? ' disabled' : '')+'>'+(stBusy ? 'Connecting...' : 'Connect Screen Time')+'</button></div>';
}
// Optional morning reminder (app only). Off until the player turns it on here; the iOS permission prompt shows only then.
let remind = (function(){ try { return JSON.parse(localStorage.getItem('blip-remind')) || {}; } catch(e){ return {}; } })();
let remindNote = '';
function remindTime(){ return String(remind.h == null ? 8 : remind.h).padStart(2, '0')+':'+String(remind.m || 0).padStart(2, '0'); }
function remindSave(){ try { localStorage.setItem('blip-remind', JSON.stringify(remind)); } catch(e){} }
function remindSync(){
  const p = MORNING ? stPlugin() : null; if (!p) return Promise.resolve(true);
  if (!remind.on || !S || S.done) return p.remindOff().then(() => true).catch(() => true);
  return p.remindOn({name: S.name, hour: remind.h == null ? 8 : remind.h, minute: remind.m || 0}).then(r => !!(r && r.granted)).catch(() => false);
}
function remindCardHTML(){
  if (!MORNING) return '';
  return '<div class="card"><h2>⏰ Morning reminder</h2><div class="switch"><span>Remind me when '+esc(S.name)+'\'s next year is ready</span><input type="checkbox" id="rmon" '+(remind.on ? 'checked' : '')+'></div>'+
    (remind.on ? '<div class="switch"><span>Time</span><input type="time" id="rmtime" value="'+remindTime()+'"></div>' : '')+
    '<p class="muted small" style="margin:6px 0 0">One a day. It never shows your screen time or results.</p>'+
    (remindNote ? '<div class="verdict" style="background:#fff3d6;color:#6b4a00">'+esc(remindNote)+'</div>' : '')+'</div>';
}
function bindRemind(){
  if ($('stcheck')) $('stcheck').onclick = showStCheck;
  if ($('rmon')) $('rmon').onchange = e => {
    remind.on = e.target.checked; remindNote = ''; remindSave(); render();
    remindSync().then(ok => { if (!ok && remind.on) { remind.on = false; remindSave(); remindNote = 'Notifications are off for Blip. You can turn them on in iPhone Settings > Notifications > Blip.'; render(); } });
  };
  if ($('rmtime')) $('rmtime').onchange = e => { const [h, m] = e.target.value.split(':').map(Number); if (isNaN(h)) return; remind.h = h; remind.m = m || 0; remindSave(); remindSync(); };
}
function bindST(){
  if ($('stgo')) $('stgo').onclick = () => { try { stConnect(); } catch(e) { stBusy = false; stNote = 'Screen Time error: '+(e && e.message || e); render(); } };
  if ($('stoff')) $('stoff').onclick = () => stOff('');
  if ($('stpick')) $('stpick').onclick = () => { const p = stPlugin(); if (p) p.pickApps().then(x => x && x.picked ? p.start() : null).then(stRefresh).catch(() => {}); };
}

  if (!p || !shopReady) return modal('<h2>🎁 Almost open</h2><p class="muted">The gift shop opens soon. Try things on for now!</p><button class="btn" data-close>OK</button>');
  shopBusy = true; render(); track('shop-tap-'+k);
  p.buy({id: GIFT.pid(k)}).then(r => { shopBusy = false; if (r.status === 'bought') got(); else render();
    if (r.status === 'pending') modal('<h2>Waiting for approval</h2><p class="muted">The gift arrives as soon as the purchase is approved.</p><button class="btn" data-close>OK</button>');
  }).catch(() => { shopBusy = false; render(); });
}

function newLife(name, skin, hair, goal, gen, bonus, inherit){
  const b = bonus || 0;
  return {inherit: inherit || null,
    name, skin, hair, goal, gen: gen || 1,
    age: 0, h: 50 + b, s: 50 + b, j: 50 + b, money: 0,
    streak: 0, best: 0, edu: null, eduTier: 0, job: null, pay: 0, talent: null, partner: null,
    used: [], log: [], lastDate: null, testMode: S ? S.testMode : false, done: false
  };
}

function stage(age){
  if (age < 5) return 'baby';
  if (age < 13) return 'kid';
  if (age < 14) return 'middle';
  if (age < 18) return 'teen';
  if (age < 23) return 'young';
  if (age < 65) return 'adult';
  return 'senior';
}
const STAGE_NAMES = {baby:'Baby', kid:'Kid', middle:'Teenager', teen:'Teenager', young:'Young adult', adult:'Adult', senior:'Golden years'};

// A day runs from 4am to 4am, so a check-in just after midnight still counts for the night before.
function today(){ const d = new Date(Date.now() - 4*3600e3); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dayNum(key){ const [y,m,d] = key.split('-').map(Number); return Math.round(Date.UTC(y, m-1, d) / 864e5); }
function dayKey(n){ const d = new Date(n * 864e5); return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate(); }
function canCheckIn(){ return S.testMode || S.lastDate !== today(); }
function clamp(v){ return Math.max(0, Math.min(100, Math.round(v))); }
function fmtTime(m){ const h = Math.floor(m/60), mm = m%60; return h ? (mm ? h+'h '+mm+'m' : h+'h') : mm+'m'; }
// Live Screen Time arrives in 5-minute steps (rounded down), so the true number is somewhere in the next 5 minutes.
// Showing that range means iPhone's own Screen Time number almost always sits inside it.
function fmtRange(m){ const a = fmtTime(m), b = fmtTime(m + 5), ah = Math.floor(m/60), bh = Math.floor((m+5)/60);
  return ah && ah === bh && m % 60 ? a.replace(/m$/, '')+'–'+(m+5)%60+'m' : !ah && !bh ? m+'–'+(m+5)+'m' : a+'–'+b; }
function fmtMoney(k){ if (k < 0) return '-'+fmtMoney(-k); if (k >= 1000) return '$'+(k/1000).toFixed(k >= 10000 ? 0 : 1)+'M'; return '$'+Math.round(k)+'K'; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ============ ONE YEAR PASSES ============
function tierFor(mins){
  const g = S.goal;
  if (mins <= g * SETTINGS.greatIfUnder) return 'great';
  if (mins <= g) return 'good';
  if (mins <= g * SETTINGS.mehIfOver) return 'meh';
  if (mins <= g * SETTINGS.awfulIfOver) return 'bad';
  return 'awful';
}
function checkIn(mins, src, tierOverride, silent){
  const tier = tierOverride || tierFor(mins);
  const entry = liveYear(mins, tier);
  if (S.goalNext != null) { S.goal = S.goalNext; delete S.goalNext; } // a goal changed on Today starts the day after it was changed
  if (src === 'st') { entry.src = 'st'; S.stUsed = true; }
  S.lastDate = today();
  save();
  track('checkin');
  if ([2,3,7,14,30,60,100].includes(S.log.length) && !S.testMode) track('day-'+S.log.length);
  checkTrophies();
  render();
  if (silent) return entry;
  showYear(entry);
}

// One year of the character's life. tier 'skipped' means a day you didn't check in (manual players).
// tier 'quiet' (app, automatic Screen Time) is a missed day with no stored number: neutral, no stat loss, streak untouched.
function liveYear(mins, tier){
  const g = S.goal;
  const met = tier === 'great' || tier === 'good', quiet = tier === 'quiet';

  S.age++;
  const st = stage(S.age);
  let ev;
  if (quiet) ev = ['🌙', pick(QUIET_LINES).replace('{name}', S.name), {}];
  else {
    const pool = EVENTS[st][met ? 'good' : 'bad'];
    let fresh = pool.filter(e => !S.used.includes(e[1]));
    // Every stage has at least one event per year it lasts, so nothing repeats in a lifetime.
    // (Safety net only: if a pool ever runs dry, allow repeats from it.)
    if (!fresh.length) { S.used = S.used.filter(t => !pool.some(e => e[1] === t)); fresh = pool; }
    ev = pick(fresh);
    S.used.push(ev[1]);
  }

  const mult = {great:1.5, good:1, meh:0.75, bad:1.5, skipped:1.5, awful:2, quiet:0}[tier];
  const fx = {};
  for (const k in ev[2]) fx[k] = Math.round(ev[2][k] * mult);
  if (S.age > 60 && !quiet) fx.h = (fx.h || 0) - 1; // getting older

  const notes = [];
  if (tier === 'skipped') notes.push(pick(SKIP_LINES).replace('{name}', S.name));
  let streakBonus = 0;
  if (quiet) {}
  else if (met) {
    S.streak++;
    S.best = Math.max(S.best, S.streak);
    const bonus = SETTINGS.streakBonuses[S.streak];
    if (bonus) {
      streakBonus = bonus;
      notes.push('🔥 '+S.streak+' day streak! +'+bonus+' to everything.');
    }
  } else {
    if (S.streak >= 3) notes.push('💔 Your '+S.streak+' day streak ended.');
    S.streak = 0;
  }
  const shown = applyFx(fx);
  // Gains shrink near 100; flag it so the year card can explain the smaller numbers.
  const shrunk = Object.keys(fx).some(k => fx[k] > 0 && shown[k] < fx[k]);
  // The streak bonus always adds its full amount (only capped at 100).
  for (const k of ['h','s','j']) {
    if (!streakBonus) break;
    const before = S[k];
    S[k] = clamp(S[k] + streakBonus);
    shown[k] = (shown[k] || 0) + (S[k] - before);
  }

  let earned = 0;
  // Good years add to savings. Bad years eat into them (impulse buys, missed work, late fees).
  if (quiet) {}
  else if (met) { if (S.pay > 0) earned = Math.round(S.pay * 0.3); }
  else earned = -Math.min(Math.max(0, S.money), Math.round(Math.max(S.pay * 0.2, S.money * 0.03)));
  const wasInDebt = S.money < 0;
  S.money += earned;
  if (wasInDebt && S.money >= 0) notes.push('🎉 Student loans paid off!');
  if (S.age === 18 && S.inherit && S.inherit.fund > 0) {
    S.money += S.inherit.fund;
    notes.push('🎁 '+S.inherit.from+'\'s college fund arrived!');
  }
  const buys = buyThings();

  // A quiet year's milestone goes by how the Blip is doing, and never costs stats.
  const ms = milestone(S.age, quiet ? (S.h + S.s + S.j) / 3 >= 50 : met);
  if (ms && ms.fx) { const f = {}; for (const k in ms.fx) if (!quiet || ms.fx[k] > 0) f[k] = ms.fx[k]; applyFx(f); }
  if (S.age === 22 && LOANS[S.eduTier]) {
    S.money -= LOANS[S.eduTier];
    notes.push('🎓 Graduated! Good years pay off the student loans.');
  }

  const entry = {age:S.age, date:today(), mins, goal:g, tier, emoji:ev[0], text:ev[1], fx: shown, shrunk, earned, notes, ms: ms ? {emoji:ms.emoji, title:ms.title, text:ms.text} : null};
  if (buys.length) entry.buys = buys;
  S.log.push(entry);
  if (S.age >= SETTINGS.lifeLength) S.done = true;
  return entry;
}

// ============ SKIPPED DAYS ============
const QUIET_LINES = [
  '{name} missed you. A quiet year.',
  '{name} missed you. A quiet, ordinary year.',
  'A quiet year. {name} kept your spot warm.',
  '{name} had a calm year and wondered where you went.'
];
const SKIP_LINES = [
  '👻 You weren\'t around. {name} spent the year glued to the couch.',
  '👻 No check-in. {name} wandered through the year on autopilot.',
  '👻 You disappeared, so {name} picked up their phone instead.',
  '👻 {name} waited for you all year. You never came.'
];
// Each full day without a check-in is a rough year lived without you (at most a few per break).
// With automatic Screen Time in the app, missed days from the last week play out from each day's real number instead.
const CATCHUP_DAYS = 7;
let catchingUp = false;
function catchUp(){
  if (!S || S.done || S.testMode || !S.lastDate || catchingUp) return;
  if (pendingMiss && pendingMiss.last === S.lastDate) return;
  pendingMiss = null;
  const t = dayNum(today()), last = S.lastDate, missed = t - dayNum(last) - 1;
  if (missed < 1) return;
  // The calendar days nobody lived (in the app, the last check-in covered the day before it, and today's covers yesterday).
  const days = []; for (let d = dayNum(last); d < t - 1; d++) days.push(d);
  const p = MORNING && autoOn() ? stPlugin() : null, near = days.filter(d => d >= t - CATCHUP_DAYS);
  const wait = got => { pendingMiss = {days, got, last}; if (tab === 'home') render(); };
  if (!p || !near.length) return p ? wait({}) : playMissed(days, {});
  catchingUp = true;
  Promise.all(near.map(d => p.minutesFor({day: stKey(d)}).then(x => [d, x && typeof x.minutes === 'number' ? x.minutes : null]).catch(() => [d, null])))
    .then(r => { catchingUp = false; if (S.lastDate !== last) return; const got = {}; for (const [d, m] of r) if (m != null) got[d] = m; wait(got); });
}
let pendingMiss = null;   // {days, got, last}: missed years waiting on the cake screen (app + automatic Screen Time)
function playMissed(days, got, silent){
  const missed = days.length, entries = [], auto = MORNING && autoOn();
  let rough = 0;
  for (const d of days) {
    if (S.done) break;
    if (got[d] != null) { const m = Math.min(960, got[d]), e = liveYear(m, tierFor(m)); e.src = 'st'; S.stUsed = true; entries.push(e); }
    else if (rough < SETTINGS.maxSkippedYears) { entries.push(liveYear(null, auto ? 'quiet' : 'skipped')); rough++; }
  }
  const years = SETTINGS.maxSkippedYears, real = entries.length - rough;
  S.lastDate = dayKey(dayNum(today()) - 1);   // today's check-in is still open
  save();
  if (real) checkTrophies();
  render();
  if (silent || !entries.length) return entries;
  let h = real ? '<div class="banner" style="background:var(--good)">📱 Welcome back</div>'+
      '<h2>'+esc(S.name)+' lived '+entries.length+' year'+(entries.length > 1 ? 's' : '')+' while you were away</h2>'+
      '<p>'+(rough ? real+' of them used that day\'s Screen Time. The rest were quiet years.' : 'Each one used that day\'s Screen Time, so your time off your phone still counted.')+'</p>' :
    auto ? '<div class="banner" style="background:#8fa3c8">🌙 Welcome back</div>'+
      '<h2>'+esc(S.name)+' had '+entries.length+' quiet year'+(entries.length > 1 ? 's' : '')+'</h2>'+
      '<p>Screen Time had no numbers for those days, so nothing was lost. '+esc(S.name)+' just missed you.</p>' :
    '<div class="banner" style="background:var(--meh)">👻 You were away</div>'+
    '<h2>You missed '+missed+' day'+(missed > 1 ? 's' : '')+'</h2>'+
    '<p>'+esc(S.name)+' lived '+entries.length+' year'+(entries.length > 1 ? 's' : '')+' without you'+(missed > years ? ' (never more than '+years+' per break)' : '')+'.</p>';
  for (const e of entries) {
    h += '<div class="year" style="text-align:left"><div class="age"><b>'+e.age+'</b>age</div><div class="what"><div class="t">'+e.emoji+' '+esc(e.text)+'</div>'+
      '<div class="fx" style="justify-content:flex-start">'+fxHTML(e.fx, e.earned)+'</div>'+
      (e.ms ? '<div class="ms"><b>'+e.ms.emoji+' '+esc(e.ms.title)+'</b><br><span class="muted">'+esc(e.ms.text)+'</span></div>' : '')+'</div></div>';
  }
  h += '<p class="muted">Check in every day so you don\'t miss their life.</p><button class="btn" data-close>'+(S.done ? 'See how their life went' : MORNING ? 'Live yesterday\'s year' : 'Check in for today')+'</button>';
  modal(h);
}

// Gains shrink as a stat nears 100, so it takes steady good days to stay on top.
function applyFx(fx){
  const real = {};
  for (const k in fx) {
    let v = fx[k];
    if (v > 0 && k !== 'money') v = Math.max(1, Math.round(v * Math.min(1, (100 - S[k]) / 50)));
    const before = S[k];
    S[k] = clamp(S[k] + v);
    real[k] = S[k] - before;
  }
  return real;
}

// ============ BIG LIFE MOMENTS ============
// A big life moment only goes well if you hit your goal that day AND the stats are good enough.
function milestone(age, met){
  const avg = (S.h + S.s + S.j) / 3;
  if (age === 5) return met && S.j >= 50
    ? {emoji:'🎒', title:'First day of school', text:'Walked in like they owned the place. Made three friends by lunch.', fx:{j:4}}
    : {emoji:'🎒', title:'First day of school', text:'Cried at the door for twenty minutes. Eventually made one friend.', fx:{j:-3}};

  if (age === 10) {
    if (!met) {
      S.talent = 'gamer';
      return {emoji:'🕹️', title:'Talent discovered: Video games', text:'Can beat any level in under a minute. Cannot do a single push-up.', fx:{h:-3}};
    }
    const top = [['h',S.h],['s',S.s],['j',S.j]].sort((a,b) => b[1]-a[1])[0][0];
    S.talent = {h:'athlete', s:'scientist', j:'performer'}[top];
    return {
      h:{emoji:'⚡', title:'Talent discovered: Sports', text:'Fastest kid in the whole school. Coaches are already asking about them.'},
      s:{emoji:'🤖', title:'Talent discovered: Science', text:'Built a working robot out of an old vacuum cleaner.'},
      j:{emoji:'🎤', title:'Talent discovered: Performing', text:'Stole the show in the school play. Standing ovation.'}
    }[top];
  }

  if (age === 14) return met
    ? {emoji:'🏫', title:'First day of high school', text:'Joined three clubs and found their crew by lunch.', fx:{j:6}}
    : {emoji:'🏫', title:'First day of high school', text:'Walked into the wrong classroom. Twice. Was staring at their phone both times.', fx:{j:-4}};

  if (age === 16) return met && (S.h + S.s)/2 >= 50
    ? {emoji:'🚗', title:'Driving test', text:'Passed on the first try! Freedom!', fx:{j:8}}
    : {emoji:'🚧', title:'Driving test', text:'Failed. Ran over a cone. Then a second cone. Then the mailbox.', fx:{j:-5}};

  if (age === 18) {
    let tier = S.s >= 75 ? 3 : S.s >= 55 ? 2 : S.s >= 35 ? 1 : 0;
    const bombed = !met && tier > 0;
    if (bombed) tier--;
    const why = bombed ? 'Stayed up scrolling the night before the entrance exam and bombed it. ' : '';
    if (tier === 3) { S.edu = 'Starfield University'; S.eduTier = 3; return {emoji:'🎓', title:'Got into their dream school!', text:'Accepted to Starfield University, one of the best in the world.', fx:{j:10}}; }
    if (tier === 2) { S.edu = 'State University'; S.eduTier = 2; return {emoji:'🎓', title:'Off to college', text:why+'Accepted to State University. Go Mighty Moose!', fx:{j: bombed ? 0 : 6}}; }
    if (tier === 1) { S.edu = 'Community College'; S.eduTier = 1; return {emoji:'📘', title:'Community college', text:why+'Didn\'t get into the big schools, but enrolled at the community college.', fx:{j: bombed ? -3 : 0}}; }
    S.job = 'Burger Barn cashier'; S.pay = 20;
    return {emoji:'🍔', title:'No college', text:why+(bombed ? 'Now working the fryer at Burger Barn.' : 'Grades were too low to get in anywhere. Now working the fryer at Burger Barn.'), fx:{j:-6}};
  }

  if (age === 22) {
    let score = S.s*0.6 + S.h*0.2 + S.j*0.2 + S.eduTier*8;
    if (!met) score -= 20;
    const why = met ? '' : 'Overslept the big interview after scrolling all night. ';
    let job, pay, text;
    if (met && S.talent === 'athlete' && S.h >= 85) { job='Pro soccer player'; pay=900; text='Signed with a pro team! Their face is on a cereal box.'; }
    else if (met && S.talent === 'scientist' && S.s >= 85 && S.eduTier >= 2) { job='Rocket scientist'; pay=250; text='Hired by a space company to build rockets. Literally rocket science.'; }
    else if (met && S.talent === 'performer' && S.j >= 85) { job='Movie star'; pay=1000; text='Discovered at a coffee shop. Now starring in a superhero movie.'; }
    else if (score >= 80) { [job,pay] = pick([['Doctor',220],['Software engineer',180],['Airline pilot',200]]); text='Landed a dream job as a '+job.toLowerCase()+'.'; }
    else if (score >= 65) { [job,pay] = pick([['Architect',110],['Toy designer',120],['Nurse',95]]); text='Got a great job as a '+job.toLowerCase()+'.'; }
    else if (score >= 50) { [job,pay] = pick([['Electrician',80],['Teacher',65],['Chef',60]]); text=why+'Found a job as a '+job.toLowerCase()+'.'; }
    else if (score >= 35) { [job,pay] = pick([['Delivery driver',45],['Call center agent',38]]); text=why+'Took a job as a '+job.toLowerCase()+'. It pays the bills. Mostly.'; }
    else { job='Seasonal mall Santa'; pay=20; text=why+'The only job they could get: mall Santa. It\'s July.'; }
    S.job = job; S.pay = pay;
    return {emoji:'💼', title:'First real job: '+job, text, fx:{j: !met ? -4 : pay >= 100 ? 8 : pay >= 50 ? 3 : -4}};
  }

  if (age === 28) {
    if (met && S.j >= 60) { S.partner = pick(['Sam','Alex','Jordan','Riley','Casey','Morgan']); return {emoji:'💞', title:'Found their person', text:'Met '+S.partner+' at a rock climbing gym. It was love at first belay.', fx:{j:12}}; }
    return {emoji:'🐈', title:'Still single', text:'Adopted a cat named Gerald instead. Gerald does not like them.', fx:{j:-2}};
  }

  if (age === 35 && S.job) {
    if (met && avg >= 65) { S.pay = Math.round(S.pay*1.6); S.job = 'Senior ' + S.job.toLowerCase(); return {emoji:'🚀', title:'Big promotion!', text:'Promoted to '+S.job+'. Corner office unlocked.', fx:{j:8}}; }
    if (avg < 35 || (!met && avg < 50)) { S.pay = Math.round(S.pay*0.5); return {emoji:'📦', title:'Fired!', text:'Got caught scrolling during the big meeting. Now doing part time work.', fx:{j:-10}}; }
    if (!met) return {emoji:'🪑', title:'Passed over', text:'The promotion went to the coworker who doesn\'t check their phone in meetings.', fx:{j:-5}};
  }

  if (age === 45) return met && S.h >= 60
    ? {emoji:'🏅', title:'Midlife glow up', text:'Ran a full marathon at 45. Kids are mildly impressed.', fx:{j:6}}
    : {emoji:'🏍️', title:'Midlife crisis', text:'Bought a motorcycle. Can\'t ride it. It lives in the garage now.', fx:{j:-4}};

  if (age === 65) {
    let tier = netWorth() >= 2000 ? 2 : netWorth() >= 700 ? 1 : 0;
    const scammed = !met && tier > 0;
    if (scammed) { tier--; S.money = Math.round(S.money * 0.6); }
    const why = scammed ? 'Lost a big chunk of savings to an online scam right before retiring. ' : '';
    if (tier === 2) { S.job = 'Retired'; S.pay = 0; return {emoji:'🏝️', title:'Retired in style', text:'Retired to a beach house in Hawaii. Wears flip flops full time.', fx:{j:12}}; }
    if (tier === 1) { S.job = 'Retired'; S.pay = 0; return {emoji:'🌻', title: scammed ? 'Retired, barely' : 'Happy retirement', text: scammed ? why+'Still retired, but the garden got a lot smaller.' : 'Retired comfortably with a big garden and a porch swing.', fx:{j: scammed ? -3 : 8}}; }
    S.job = 'Mega-Mart greeter'; S.pay = 25;
    return {emoji:'🛒', title:'Can\'t afford to retire', text:why+'Didn\'t save enough. Now a greeter at Mega-Mart. Waves a lot.', fx:{j:-6}};
  }
  return null;
}

function lifeScore(){
  const avg = (S.h + S.s + S.j) / 3;
  const metDays = S.log.filter(e => e.tier === 'good' || e.tier === 'great').length;
  return Math.round(avg + Math.min(30, netWorth()/200) + metDays/2);
}
function lifeTitle(score){
  if (score >= 120) return ['🏆','A legendary life'];
  if (score >= 95) return ['🌟','An amazing life'];
  if (score >= 70) return ['😊','A pretty good life'];
  if (score >= 45) return ['😐','A so-so life'];
  return ['🥔','A couch potato life'];
}

let taps = [], bubbleTimer;
function tapCharacter(wrapId, bubId, upOverride){
  const wrap = $(typeof wrapId === 'string' ? wrapId : 'buddy');
  if (!wrap) return;
  const now = Date.now();
  taps = taps.filter(t => now - t < 3000); taps.push(now);
  const st = stage(S.age);
  const last = S.log.length ? S.log[S.log.length-1] : null;
  const up = typeof upOverride === 'boolean' ? upOverride : !(last && !(last.tier === 'good' || last.tier === 'great' || last.tier === 'restored' || last.tier === 'quiet')) && S.j >= 30;
  let line;
  if (taps.length >= 5) line = pick(TICKLE_LINES);
  else if (up && S.streak >= 3 && Math.random() < 0.3) line = pick(STREAK_LINES).replace('{n}', S.streak);
  else line = pick(LINES[st][up ? 'up' : 'down']);
  wrap.classList.remove('hop', 'droop'); void wrap.offsetWidth;
  wrap.classList.add(up ? 'hop' : 'droop');
  const bub = $(typeof bubId === 'string' ? bubId : 'bubble');
  bub.textContent = line;
  bub.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bub.classList.remove('show'), 3200);
  if (!S.tapped) { S.tapped = true; save(); const h = $('taphint'); if (h) h.remove(); }
}

// ============ USAGE STATS ============
// GoatCounter (free, no cookies, nothing personal) on the same gamesbyvidal account as Freefall.
// Only on the real site, so testing doesn't count. Numbers at https://gamesbyvidal.goatcounter.com
// Events (all start with "lifetime-"): new-blip, checkin, day-N (2,3,7,14,30,60,100 check-ins),
// share-open, share-sent, invite, friend-link-opened, raise-from-link, next-generation, opened-installed.
// In the phone app, visits show under /lifetime-app/ and events start with "lifetime-app-".
const onRealSite = location.hostname === 'gamesbyvidal.github.io' || IS_APP;
// The phone app runs no downloaded code (App Review 2.5.2/2.5.19): it sends GoatCounter's plain counting pixel instead of count.js.
// If the player said they're under 13 (the optional Time back age), this phone sends no stats at all.
function statsOK(){ const a = playerAge(); return !(a > 0 && a < 13); }
function gcHit(path, title, event){
  if (!statsOK()) return;
  try { new Image().src = 'https://gamesbyvidal.goatcounter.com/count?p='+encodeURIComponent(path)+'&t='+encodeURIComponent(title)+(event ? '&e=true' : '')+'&rnd='+Math.random().toString(36).slice(2); } catch(e) {}
}
if (onRealSite && IS_APP) gcHit('/lifetime-app/', document.title, false);
else if (onRealSite && statsOK()) {
  const counter = document.createElement('script');
  counter.async = true;
  counter.src = 'https://gc.zgo.at/count.js';
  counter.dataset.goatcounter = 'https://gamesbyvidal.goatcounter.com/count';
  document.head.appendChild(counter);
}
const trackQueue = [];
function track(name){
  if (!onRealSite || !statsOK()) return;
  if (IS_APP) return gcHit('lifetime-app-'+name, 'Lifetime: '+name, true);
  const send = n => { try { window.goatcounter.count({path:'lifetime-'+n, title:'Lifetime: '+n, event:true}); } catch(e) {} };
  if (window.goatcounter && window.goatcounter.count) send(name);
  else { trackQueue.push(name); if (trackQueue.length === 1) setTimeout(function flush(){ if (window.goatcounter && window.goatcounter.count) while (trackQueue.length) send(trackQueue.shift()); else if (trackQueue.length < 20) setTimeout(flush, 1500); }, 1500); }
}

// Bought automatically, one per year, in this order, once the Blip is 18+.
// Homes trade in at full value, cars at half. Money is in $K like S.money.
const LADDER = [
  {key:'hatch',     kind:'car',  name:'used hatchback',    price:15},
  {key:'starter',   kind:'home', name:'starter home',      price:100},
  {key:'trip',      kind:'trip', name:'dream trip',        price:20, fx:{j:15}},
  {key:'suv',       kind:'car',  name:'family SUV',        price:40},
  {key:'family',    kind:'home', name:'family house',      price:250},
  {key:'dreamcar',  kind:'car',  name:'dream convertible', price:90},
  {key:'dreamhome', kind:'home', name:'dream home',        price:600},
  {key:'boat',      kind:'extra', name:'sailboat',          price:150},
  {key:'beach',     kind:'extra', name:'beach house',       price:900},
  {key:'island',    kind:'extra', name:'private island',    price:3000}
];
// Big purchases wait for the right time of life, so high earners can't have it all by 30.
function unlockAge(item){
  const settled = S.partner ? 28 : 35;
  return {suv:settled, family:settled, dreamcar:45, dreamhome:45, boat:45, beach:50, island:55}[item.key] || 18;
}
// Student loans from college, paid off by good years. In $K.
const LOANS = {3:200, 2:60, 1:30};
const ITEM = Object.fromEntries(LADDER.map(x => [x.key, x]));
const CAR_KEY = {hatch:'hatch', suv:'suv', dreamcar:'dream'};       // item -> CAR_ART
const HOME_KEY = {starter:'starter', family:'family', dreamhome:'dream'}; // item -> HOME_ART
const ITEM_ICON = {starter:'house', family:'bighouse', dreamhome:'mansion', trip:'plane', boat:'boat', beach:'beach', island:'island'};
function owned(){ return S.owned || (S.owned = {car:null, home:null, bought:[]}); }
function tradeIn(item){
  const o = owned();
  if (item.kind === 'car' && o.car) return ITEM[o.car].price / 2;
  if (item.kind === 'home' && o.home) return ITEM[o.home].price;
  return 0;
}
function nextItem(){ const o = owned(); return LADDER.find(x => !o.bought.some(b => b.key === x.key)) || null; }
function itemCost(item){ return Math.max(0, item.price - tradeIn(item)); }
function netWorth(){
  const o = owned();
  const extras = o.bought.filter(b => ITEM[b.key].kind === 'extra').reduce((t, b) => t + ITEM[b.key].price * (b.key === 'boat' ? .5 : 1), 0);
  return S.money + (o.home ? ITEM[o.home].price : 0) + (o.car ? ITEM[o.car].price / 2 : 0) + extras;
}
function buyThings(){
  const item = nextItem();
  if (!item || S.age < unlockAge(item)) return [];
  const cost = itemCost(item);
  if (S.money < cost) return [];
  const o = owned();
  S.money -= cost;
  if (item.kind === 'car') o.car = item.key;
  if (item.kind === 'home') o.home = item.key;
  if (item.fx) applyFx(item.fx);
  o.bought.push({key:item.key, age:S.age});
  return [{key:item.key, cost, traded:item.price - cost}];
}
function itemArt(key, cls){
  if (CAR_KEY[key]) return '<svg class="'+(cls||'')+'" viewBox="0 0 200 120">'+CAR_ART[CAR_KEY[key]].svg+'</svg>';
  return '<svg class="'+(cls||'')+'" viewBox="0 0 100 100">'+ICONS[ITEM_ICON[key]]+'</svg>';
}

function buyLine(b){

  if (b.key === 'hatch') return esc(S.name)+' bought '+pron()+' first car!';

  if (S.age < 18) return null;
  if (m < 0) { const L = LOANS[S.eduTier] || -m; return {icon:'🎓', label:'Paying off college first', pct:clamp((1 - (-m) / L) * 100)}; }
  const nxt = nextItem();
  if (!nxt) return null;
  const cost = itemCost(nxt);
  return {icon:nxt.kind === 'home' ? '🏠' : nxt.kind === 'car' ? '🚗' : '✨', label:'Saving for '+goalName(nxt), next:goalName(nxt), pct:cost ? clamp(m / cost * 100) : 100};

// One line under the scene: what's new in the yard, or what the weather means.
function sceneNote(){
  const wx = weatherNow(), fresh = S.age < 18 ? newYardThing() : null;
  if (fresh) return '<span class="pop">✨ New</span> <b>'+YARD.P[fresh.k][0].replace(/^./, c => c.toUpperCase())+'</b> from "'+esc(fresh.text)+'"';
  if (wx === 'rain') return '☔ Rainy year. Hit your goal to bring the sun back.';
  if (wx === 'cloud') return '⛅ Cloudy year. Stay under your goal for sunshine.';
  if (S.streak >= 3) return '🪁 '+S.streak+' day streak. The kite is up!';

// What hitting or missing the goal does on each big day.
const PATH_HINT = {
  5: ['makes friends fast', 'cries at the door'],
  10: ['finds a real talent', 'becomes a gamer'],
  14: ['finds a crew', 'gets lost staring at the phone'],
  16: ['passes the driving test', 'runs over the mailbox'],
  18: ['gets the best college grades allow', 'bombs the entrance exam'],
  22: ['nails the job interview', 'oversleeps the interview'],
  28: ['might find love', 'adopts a grumpy cat instead'],
  35: ['could get promoted', 'gets passed over'],
  45: ['runs a marathon', 'has a midlife crisis'],
  65: ['retires in style', 'falls for a scam']
};
function pathHTML(){
  const ages = Object.keys(UPCOMING).map(Number).filter(a => a > S.age).slice(0, 4);
  if (!ages.length) return '';
  const nb = ages[0], left = nb - S.age - (canCheckIn() ? 1 : 0);
  const when = left === 0 ? 'Today' : left === 1 ? 'Tomorrow' : 'In '+left+' days';
  const stop = (e, a, t, cls) => '<div class="stop '+(cls||'')+'"><div class="dot">'+e+'</div><b>'+a+'</b><span>'+t+'</span></div>';
  const sc = {baby:.62, kid:.8, middle:.86, teen:.92, young:.97, adult:1, senior:.95}[stage(S.age)], cy = 230 - 148*sc;
  const face = '<svg viewBox="'+(100-64*sc)+' '+(cy-70*sc)+' '+(128*sc)+' '+(128*sc)+'">'+charSVG(S).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '')+'</svg>';
  let h = '<div class="card"><h2 class="earnh">🛣️ Coming up<small>'+(left < 2 ? when+' is big!' : when)+'</small></h2><div class="road">'+
    stop(face, S.age, 'Now', 'now')+ages.map((a, i) => stop(UPCOMING[a][0], a, UPCOMING[a][1], i === 0 ? 'next' : '')).join('')+'</div>';
  const hint = PATH_HINT[nb], he = S.girl ? 'she' : 'he';
  if (hint) h += '<div class="tmr"><b>'+(left < 2 ? when : 'At '+nb)+': '+UPCOMING[nb][1]+'</b><br>Hit your goal that day and '+esc(S.name)+' '+hint[0]+'. Miss it and '+he+' '+hint[1]+'.</div>';
  return h+'</div>';
}

// Before 18 there's no money yet, so show how the kid is growing and where it leads.
function growHTML(){
  const last = S.log[S.log.length-1], fx = (last && last.age === S.age && last.fx) || {};
  const bar = (k, e, n, c) => '<div class="sk"><span>'+e+'</span><span>'+n+'</span><i class="nbar"><u style="width:'+S[k]+'%;background:'+c+'"></u></i><span class="v">'+S[k]+
    (fx[k] ? ' <em class="'+(fx[k] > 0 ? 'up' : 'dn')+'">'+(fx[k] > 0 ? '+' : '')+fx[k]+'</em>' : '')+'</span></div>';
  const sch = [[75,'Starfield University'],[55,'State University'],[35,'Community college']];
  const at = sch.find(x => S.s >= x[0]), up = sch.slice().reverse().find(x => S.s < x[0]);
  const him = S.girl ? 'her' : 'him';
  let h = '<div class="card"><h2 class="earnh">🌱 Growing up<small>Age '+S.age+'</small></h2><div class="muted small">At 18 these decide '+esc(S.name)+'\'s college. At 22, the first job.</div>'+
    bar('h','💪','Health','var(--h)')+bar('s','🧠','Smarts','var(--s)')+bar('j','😊','Joy','var(--j)')+
    '<div class="track">🎓 On track for <b>'+(at ? at[1] : 'no college yet')+'</b>'+(up ? '<br><span class="muted small">Smarts '+up[0]+' gets '+him+' into '+up[1]+'. '+(up[0] - S.s)+' to go.</span>' : '')+'</div>';
  if (S.inherit && S.inherit.fund > 0) h += '<div class="talent">🎁 '+esc(S.inherit.from)+' left a <b>college fund</b>. It arrives at 18.</div>';
  const names = {athlete:'Sports', scientist:'Science', performer:'Performing', gamer:'Video games'};
  if (S.talent) h += '<div class="talent">⭐ Talent: <b>'+names[S.talent]+'</b></div>';
  else {
    const top = [['h',S.h],['s',S.s],['j',S.j]].sort((a, b) => b[1]-a[1])[0][0];
    h += '<div class="talent">❓ A talent shows up at 10. Right now it looks like <b>'+{h:'Sports', s:'Science', j:'Performing'}[top]+'</b>.</div>';
  }
  return h+'</div>';
}

let trophyQueue = [];
// Adds any newly earned trophies to the case. Returns them so the caller can celebrate.
function checkTrophies(){
  const got = trophyCase(), fresh = [];
  TROPHIES.forEach(t => { if (got[t.k]) return; const p = t.have(); if (p[0] >= p[1]) { got[t.k] = {name:S.name, age:S.age, date:today()}; fresh.push(t); track(stUsed() && /^(st|tb)/.test(t.k) ? 'trophy' : 'trophy-'+t.k); } });
  if (fresh.length) { save(); trophyQueue = trophyQueue.concat(fresh); }
  return fresh;
}

  const list = trophyQueue; trophyQueue = [];

  const {past, up} = lifeStops(), O = '#3b2a4a';
  const pts = past.map(x => Object.assign({k:'past'}, x)).concat([{k:'now', age:S.age}], up.map((x, i) => Object.assign({k:i ? 'later' : 'next'}, x)));
  const per = 3, rows = Math.ceil(pts.length / per), RH = 104, H = rows * RH + 84, xs = [52, 150, 248];
  const pos = pts.map((p, i) => { const r = Math.floor(i / per), c = i % per; return [r % 2 ? xs[per - 1 - c] : xs[c], H - 70 - r * RH]; });
  let road = 'M'+(pos[0][0] - 30)+' '+pos[0][1];
  pos.forEach((q, i) => { if (i && Math.floor(i / per) !== Math.floor((i - 1) / per)) { const pr = pos[i - 1], side = pr[0] > 150 ? 1 : -1;
      road += ' C'+(pr[0] + side*44)+' '+pr[1]+' '+(q[0] + side*44)+' '+q[1]+' '+q[0]+' '+q[1]; } else road += ' L'+q[0]+' '+q[1]; });
  const last = pos[pos.length - 1];
  // past the last stop the road curves up and disappears into the clouds ("still to come")
  const side = Math.floor((pos.length - 1) / per) % 2 ? -1 : 1;
  road += ' C'+(last[0] + side*50)+' '+last[1]+' '+(last[0] + side*46)+' '+(last[1] - 64)+' '+(150 + side*30)+' '+(last[1] - 72)+' S150 54 150 30';
  let g = '<path d="'+road+'" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<path d="'+road+'" fill="none" stroke="#e9dcc8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="'+road+'" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="7 7"/>'+CLOUDS;
  const wrap = t => { if (t.length <= 15) return [t]; const w = t.split(' '); let a = '';
    while (w.length && (a + (a ? ' ' : '') + w[0]).length <= 15) a += (a ? ' ' : '') + w.shift();
    if (!a) a = w.shift(); let b = w.join(' '); if (b.length > 15) b = b.slice(0, 14)+'…'; return b ? [a, b] : [a]; };
  const lab = (x, y, t, sub, cls) => { const ls = wrap(t), op = cls ? ' opacity="'+cls+'"' : '';
    return ls.map((l, i) => '<text x="'+x+'" y="'+(y + i*12)+'" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="600" font-size="11" fill="'+O+'"'+op+'>'+esc(l)+'</text>').join('')+
    (sub ? '<text x="'+x+'" y="'+(y + ls.length*12)+'" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="10" fill="#7a7195"'+op+'>'+esc(sub)+'</text>' : ''); };
  pts.forEach((p, i) => { const [x, y] = pos[i];
    if (p.k === 'now') { g += '<svg x="'+(x-24)+'" y="'+(y-52)+'" width="48" height="58" viewBox="0 0 200 240">'+charSVG(S).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '')+'</svg>'+
      '<rect x="'+(x-30)+'" y="'+(y+10)+'" width="60" height="18" rx="9" fill="#7c5cff" stroke="'+O+'" stroke-width="2"/><text x="'+x+'" y="'+(y+23)+'" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="11" fill="#fff">Now · '+S.age+'</text>'; return; }
    const op = p.k === 'later' ? '.45' : '';
    g += '<g'+(p.photo ? ' class="mstop" data-age="'+p.age+'"' : '')+(op ? ' opacity="'+op+'"' : '')+'>'+(p.k === 'next' ? '<circle cx="'+x+'" cy="'+y+'" r="25" fill="#ffd36e" opacity=".55"/>' : '')+
      '<circle cx="'+x+'" cy="'+y+'" r="17" fill="'+(p.k === 'past' ? '#fff' : p.dream ? '#f6f3ff' : '#fff6d6')+'" stroke="'+O+'" stroke-width="2.5"'+(p.dream ? ' stroke-dasharray="4 3"' : '')+'/>'+
      '<text x="'+x+'" y="'+(y+6)+'" text-anchor="middle" font-size="17">'+p.e+'</text>'+
      (p.k === 'past' && p.age ? '<circle cx="'+(x+13)+'" cy="'+(y-13)+'" r="6.5" fill="#5cc26b" stroke="'+O+'" stroke-width="2"/><path d="M'+(x+10)+' '+(y-13)+' l2 2.5 4 -4.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>' : '')+
      (p.k === 'next' ? '<rect x="'+(x-18)+'" y="'+(y-36)+'" width="36" height="15" rx="7.5" fill="#ffc23d" stroke="'+O+'" stroke-width="2"/><text x="'+x+'" y="'+(y-25)+'" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="10" fill="'+O+'">Next</text>' : '')+
      lab(x, y + 30, p.t, p.dream ? 'someday' : p.age != null ? (p.k === 'past' ? 'age '+p.age : 'at '+p.age) : '')+'</g>'; });
  const top = '';
  const gs = goalState();
  const nb = up.find(x => !x.dream), hint = nb && PATH_HINT[nb.age], he = S.girl ? 'she' : 'he';
  return '<div class="card"><h2 class="earnh">🗺️ Life map<small>Big moments</small></h2><div class="lmap"><svg viewBox="0 0 300 '+H+'" width="100%" style="display:block">'+
    '<rect width="300" height="'+H+'" rx="14" fill="#e8f6e4"/>'+top+g+'</svg></div>'+
    (hint ? '<div class="tmr"><b>At '+nb.age+': '+esc(nb.t)+'</b><br>Hit your goal that day and '+esc(S.name)+' '+hint[0]+'. Miss it and '+he+' '+hint[1]+'.</div>' : '')+
    (gs ? '<div class="ygoal flat"><div class="gl"><span>'+gs.icon+' '+gs.label+'</span><b class="up">'+(gs.pct >= 100 ? 'saved!' : gs.pct >= 50 ? 'getting closer' : 'just started')+'</b></div>'+goalBar(gs.pct)+'</div>' : '')+'</div>';
}

function savedLine(){
  const diff = draft.avg - draft.goal;
  if (diff <= 0) return 'Try a goal a little below your average. That\'s where the magic happens.';
  const hrs = Math.round(diff * 365 / 60);
  return 'That\'s <b>'+hrs+' hours a year</b> back, about <b>'+Math.round(hrs/24)+' full days</b>.';
}
function goStep(n){
  // Already connected (next generation): skip the Screen Time step.
  if (n === ST_STEP && draft.auto) n += n > (draft.step || 0) ? 1 : -1;
  draft.step = Math.max(0, Math.min(SETUP_STEPS - 1, n)); render(); window.scrollTo(0, 0);
}
// Setup's Screen Time step: one explainer, then Apple's prompt. Any "no" goes straight on to manual setup.
function setupConnect(){
  let p = null; try { p = stPlugin(); } catch(e) {}
  const manual = note => { draft.stBusy = false; draft.auto = false; draft.stNote = note || ''; goStep(ST_STEP + 1); };
  if (!p) return manual('Screen Time isn\'t available, so you\'ll type in your screen time each morning.');
  draft.stBusy = true; render();
  p.authorize().then(r => {
    if (!r || !r.authorized) return manual('No problem. You\'ll type in yesterday\'s screen time each morning, and you can connect any time in Settings.');
    return p.pickApps().then(x => {
      if (!x || !x.picked) return manual('No problem. You can connect Screen Time any time in Settings.');
      return p.start().then(() => { draft.stBusy = false; draft.auto = true; draft.stJoined = Date.now(); draft.stNote = ''; goStep(ST_STEP + 1); });
    });
  }).catch(() => manual('Screen Time could not start. You can connect it any time in Settings.'));
}

  if ($('back')) $('back').onclick = () => goStep(step - 1);
  document.querySelectorAll('[data-girl]').forEach(b => b.onclick = () => { draft.girl = b.dataset.girl === 'true'; render(); setTimeout(() => goStep(2), 250); });
  document.querySelectorAll('[data-skin]').forEach(b => b.onclick = () => { draft.skin = b.dataset.skin; render(); });
  document.querySelectorAll('[data-hair]').forEach(b => b.onclick = () => { draft.hair = b.dataset.hair; render(); });
  if ($('nm')) {
    $('nm').oninput = e => { draft.name = e.target.value; };
    $('nm').onkeydown = e => { if (e.key === 'Enter') $('next').click(); };
  }
  if ($('avg')) {
    const update = () => { $('av').textContent = fmtTime(draft.avg); $('gv').textContent = fmtTime(draft.goal); $('saved').innerHTML = savedLine(); };
    $('avg').oninput = e => { draft.avg = +e.target.value; draft.goal = Math.max(15, draft.avg - 30); update(); };
    $('minus').onclick = () => { draft.goal = Math.max(15, draft.goal - 15); update(); };
    $('plus').onclick = () => { draft.goal = Math.min(720, draft.goal + 15); update(); };
  }
  if ($('next')) $('next').onclick = () => {
    if (step === 2) {
      draft.name = $('nm').value.trim();
      if (!draft.name) { $('nm').focus(); $('nm').style.borderColor = 'var(--bad)'; return; }
    }
    goStep(step + 1);
  };
  if ($('restore')) $('restore').onclick = restoreModal;
  if ($('stsetup')) $('stsetup').onclick = () => { if (!draft.stBusy) setupConnect(); };
  if ($('stskip')) $('stskip').onclick = () => { draft.stNote = ''; goStep(ST_STEP + 1); };
  if ($('start')) $('start').onclick = () => {
    const name = draft.name.trim();
    const keepTest = draft.testMode || false;
    S = newLife(name, draft.skin, draft.hair, draft.goal, draft.gen, draft.bonus, draft.inherit);
    track(draft.gen > 1 ? 'next-generation' : 'new-blip');
    S.girl = !!draft.girl;
    S.avg = draft.avg;
    if (draft.tbPrev) S.tbPrev = draft.tbPrev;
    if (draft.trophies) S.trophies = draft.trophies;
    if (draft.family) S.family = draft.family;
    if (draft.invites) S.invites = draft.invites;
    S.testMode = keepTest;
    if (draft.auto && IS_APP) { S.auto = true; S.stUsed = true; } // Screen Time stays connected for the next life
    // Automatic players type nothing: the first year plays tomorrow morning from today's Screen Time.
    if (S.auto && MORNING) { S.lastDate = today(); if (draft.stJoined) S.stJoined = draft.stJoined; }
    save(); tab = 'home'; render(); updateIcon();
    modal('<div class="birth">'+charSVG(S)+'</div><h2>'+esc(name)+' is born!</h2>'+
      '<div class="firstword">"'+esc(pick(LINES.baby.up))+'"</div>'+
      '<p>Every day you hit your goal, '+esc(name)+' has a great year. '+(S.auto && MORNING ? esc(name)+'\'s first year is happening right now. Tomorrow morning, see how it went.' : MORNING ? 'Check in now with yesterday\'s screen time to start year one.' : 'Check in tonight to start year one.')+'</p>'+
      (SHOP_ON && store.owned.some(isBabyGift) ? '<p class="muted">🍼 There are baby clothes waiting in the closet.</p>' : '')+'<button class="btn" data-close>Let\'s go</button>');
    confetti(['👶','🎉','✨','🍼','💖']);
  };
}

let cdTimer;

    document.querySelectorAll('.tcase [data-trophy]').forEach(trTap); };
  if ($('tslide')) {
    const set = m => { m = Math.max(0, Math.min(960, m)); homeMins = m; $('tslide').value = m; $('tval').textContent = fmtTime(m); $('verdict').outerHTML = verdictHTML(m); };
    $('tslide').oninput = e => set(+e.target.value);

  if ($('phonedown')) $('phonedown').onclick = () => { track('phone-down'); goodbye = 1; render(); window.scrollTo(0, 0); setTimeout(() => { if (goodbye === 1) { goodbye = 2; if (tab === 'home') render(); } }, 2600); };
  if ($('cd')) { const tick = () => { const n = new Date(), m = new Date(n); m.setHours(4,0,0,0); if (m <= n) m.setDate(m.getDate()+1); const s = Math.floor((m-n)/1000);
      $('cd') && ($('cd').textContent = String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'));
      if (s <= 0) render(); }; tick(); cdTimer = setInterval(tick, 1000); }
  bindST(); bindRemind();
  if ($('firstremind')) $('firstremind').onclick = () => { remind.on = true; remindSave(); remindSync().then(ok => { if (!ok) { remind.on = false; remindSave(); } render(); }); };
  if ($('goal')) $('goal').oninput = e => { S.goal = +e.target.value; delete S.goalNext; $('gv').textContent = fmtTime(S.goal); save(); };

  if ($('bkcopy')) $('bkcopy').onclick = () => {

    try { navigator.clipboard.writeText(code).then(done, fallback); } catch(e) { fallback(); }

  };
  function startOver(){
    draft = {name:'', skin:S.skin, hair:S.hair, girl:S.girl, avg:S.avg || S.goal + 30, goal:S.goal, step:0, testMode:S.testMode, auto:S.auto};

    render();
  }
  if ($('nextGen')) $('nextGen').onclick = () => {
    const bonus = Math.min(15, Math.round(lifeScore()/10));
    const fam = (S.family || []).concat([{name:S.name, skin:S.skin, hair:S.hair, girl:!!S.girl, gen:S.gen || 1, line:lifeTitle(lifeScore())[1]}]);
    draft = {name:'', skin:S.skin, hair:S.hair, girl:S.girl, avg:S.avg || S.goal + 30, goal:S.goal, gen:S.gen+1, bonus, inherit:inheritance(), tbPrev:timeBack(), trophies:S.trophies, invites:S.invites, step:0, testMode:S.testMode, auto:S.auto, family:fam};
    S = null; appBackup(); try { localStorage.removeItem(KEY); } catch(e){}
    render();
  };
}

function unb64url(str){ str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; return decodeURIComponent(escape(atob(str))); }

// ============ SHARE PICTURE ============
// A 1080x1350 picture of the Blip at home with a headline, drawn from one SVG onto a canvas.
function wrapText(t, max){
  const words = String(t).split(' '), lines = [];
  let line = '';
  for (const w of words) { if ((line + ' ' + w).trim().length > max && line) { lines.push(line); line = w; } else line = (line + ' ' + w).trim(); }
  if (line) lines.push(line);
  return lines;
}
function plain(html){ const d = document.createElement('div'); d.innerHTML = html; return d.textContent; }
// What the picture says: a given moment, or else the latest year.
function shareMoment(m){
  if (m) return m;
  const e = S.log[S.log.length-1];
  if (!e) return {emoji:'🌱', title:'Just getting started'};
  return yearMoment(e);
}
// One year as a share: its photo and its story line.
function yearMoment(e){
  if (e.ms) return {emoji:e.ms.emoji, title:e.ms.title, e};
  if (e.buys) return {emoji:'🔑', title:plain(buyLine(e.buys[0])), e};
  return {emoji:e.emoji, title:e.text, e};
}
// The picture's graphics are one SVG; the words are drawn on top with the app's font.
// The picture is a Polaroid of the Blip's story: the photo, "Name, age", job and home, one story line, and a footer.
// Never in it: screen time, streaks, goal results, time back, money or the shop.
function shareArt(m){
  const ink = '#3b2a4a', soft = '#7a7195';
  const sc = sceneOpts(), where = sceneLabel(sc);
  const story = wrapText(m.emoji+' '+m.title, 34).slice(0, 2);
  if (wrapText(m.emoji+' '+m.title, 34).length > 2) story[1] = story[1].replace(/[ .,!?]*$/, '...');
  const age = m.e ? m.e.age : S.age;
  const texts = [['@logo', 112, 110, 700, 1]];
  texts.push([S.name+', '+age, 900, 66, 700, 1, ink]);
  texts.push([[S.job && age >= 18 ? S.job : null, where].filter(Boolean).join(' · '), 956, 34, 500, 1, soft]);
  let y = 1030;
  for (const l of story) { texts.push([l, y, 40, 600, 1, ink]); y += 52; }
  texts.push(['Blip: a screen time game', 1238, 38, 700, 1]);
  texts.push([appURL().replace(/^https?:\/\//, '').replace(/\/(index\.html)?$/, ''), 1290, 30, 500, .95]);
  const box = 'x="160" y="220" width="760" height="590"';
  const photo = m.e ? YS.svg(m.e, box)
    : sceneSVG(sc, S).replace('<svg ', '<svg '+box+' preserveAspectRatio="xMidYMax slice" ');
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">'+
    '<defs><linearGradient id="shbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff5a8a"/></linearGradient></defs>'+
    '<rect width="1080" height="1350" fill="url(#shbg)"/>'+
    '<rect x="128" y="196" width="840" height="960" rx="16" fill="rgba(40,20,80,.25)"/>'+
    '<rect x="120" y="180" width="840" height="960" rx="16" fill="#fff" stroke="'+ink+'" stroke-width="6"/>'+
    '<rect x="96" y="160" width="150" height="46" fill="#ff9fb8" opacity=".9" transform="rotate(-14 171 183)"/><rect x="836" y="160" width="150" height="46" fill="#a99cff" opacity=".9" transform="rotate(12 911 183)"/>'+
    '<rect x="160" y="220" width="760" height="590" fill="#fff6e0"/>'+photo+
    '<rect x="160" y="220" width="760" height="590" fill="none" stroke="'+ink+'" stroke-width="5"/></svg>';
  return {svg, texts};
}
function sharePicture(m){
  const art = shareArt(m);
  const fonts = document.fonts ? Promise.all([document.fonts.load('700 50px Fredoka'), document.fonts.load('500 30px Fredoka'), document.fonts.load('600 40px Fredoka')]).catch(() => {}) : Promise.resolve();
  return fonts.then(() => new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
        const x = c.getContext('2d');
        x.drawImage(img, 0, 0, 1080, 1350);
        x.textAlign = 'center'; x.fillStyle = '#fff';
        for (const [t, y, size, w, a, col] of art.texts) { if (t === '@logo') { LOGO.draw(x, 540, y, size); continue; } x.globalAlpha = a; x.fillStyle = col || '#fff'; x.font = w+' '+size+'px Fredoka, system-ui, sans-serif'; x.fillText(t, 540, y); }
        c.toBlob(b => b ? ok(b) : bad(), 'image/png');
      } catch(e) { bad(e); }
    };
    img.onerror = bad;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(art.svg);
  }));
}
// Opens a preview of the picture with one share button. The picture is made first,
// so the share happens right on the tap (phones require that).
// One Share sheet everywhere: the picture, Send, Save picture, Copy link. Sharing is always the player's own tap.
// The picture is made first, so the share happens right on the tap (phones require that).
function shareModal(moment, opt){
  opt = opt || {};
  track('share-open');
  const m = shareMoment(moment), link = meetLink();
  const text = opt.invite ? 'Raise a Blip with me! It\'s a screen time game. Meet '+S.name+': '+link
    : 'Look at my Blip, '+S.name+'! '+m.emoji+' '+m.title+'\n'+link;
  modal('<h2>'+(opt.invite ? 'Raise a Blip with me' : 'Share '+esc(S.name))+'</h2><div class="shwrap"><div class="shload">Drawing the picture...</div><img id="shimg" class="shimg" alt=""></div>'+
    '<button class="btn sharebtn" id="shgo" disabled>📤 Send</button>'+
    '<div class="shrow"><button class="btn ghost" id="shsave" disabled>⬇️ Save picture</button><button class="btn ghost" id="shcopy">🔗 Copy link</button></div>'+
    '<p class="muted small" id="shnote">Only '+esc(S.name)+'\'s story goes in the picture.</p><button class="btn ghost" data-close style="margin-top:4px">Close</button>', 'shsheet');
  const go = $('shgo'), sv = $('shsave'), note = $('shnote');
  const sent = () => { track('share-sent'); if (opt.invite && !opt.counted) { opt.counted = true; countInvite(); } };
  const after = () => { if (opt.invite) { document.querySelectorAll('.modal').forEach(x => x.remove()); render(); showTrophies(); } };
  $('shcopy').onclick = () => { try { navigator.clipboard.writeText(opt.invite ? text : 'Meet my Blip, '+S.name+'! '+link).then(() => { $('shcopy').textContent = '✓ Copied!'; sent(); }); } catch(e) {} };
  sharePicture(m).then(blob => {
    const url = URL.createObjectURL(blob);
    $('shimg').src = url; $('shimg').classList.add('on');
    const file = new File([blob], 'blip-'+S.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')+'.png', {type:'image/png'});
    const files = navigator.canShare && navigator.canShare({files:[file]});
    go.disabled = false; sv.disabled = false;
    if (files) go.onclick = () => navigator.share({files:[file], text}).then(() => { sent(); after(); }, () => {});
    else if (navigator.share) go.onclick = () => navigator.share({text}).then(() => { sent(); after(); }, () => {});
    else go.onclick = () => $('shcopy').click();
    // Save: the app puts it straight into Photos (add-only access). Websites on phones use the share sheet
    // ("Save Image"); computers download the file.
    // iPhone asks for permission on the first tap only. If the player says no, Save uses the share sheet from then on, with no nagging.
    let noPhotos = false; try { noPhotos = localStorage.getItem('blip-photos-off') === '1'; } catch(e) {}
    const photos = noPhotos ? null : nativePlugin('BlipPhotos');
    const shareSave = () => navigator.share({files:[file]}).catch(() => {});
    const saved = () => { sv.textContent = '✓ Saved to Photos'; sv.disabled = true; };
    sv.onclick = photos ? () => {
        sv.disabled = true; sv.textContent = 'Saving...';
        const r = new FileReader();
        r.onload = () => photos.save({data: r.result}).then(saved, () => {
          try { localStorage.setItem('blip-photos-off', '1'); } catch(e) {}
          sv.disabled = false; sv.textContent = '⬇️ Save picture';
          if (files) { sv.onclick = shareSave; shareSave(); }
        });
        r.readAsDataURL(blob);
      }
      : files ? shareSave
      : () => { const a = document.createElement('a'); a.href = url; a.download = file.name; a.click(); };
    if (!files && navigator.share) note.textContent = 'Tip: press and hold the picture to save it. Only '+S.name+'\'s story goes in it.';
  }).catch(() => {
    $('shimg').parentNode.innerHTML = '<p class="muted">Couldn\'t draw the picture on this phone.</p>';
    go.disabled = false; go.onclick = () => (navigator.share ? navigator.share({text}).then(() => { sent(); after(); }, () => {}) : $('shcopy').click());
  });
}

// ============ BACKUP & REMINDER ============
// Once Screen Time numbers were used, the code carries only the Blip's story (same line as shares, see stUsed()):
// no daily minutes, goal results, streaks or Time back. Restoring keeps the Blip; streaks and time saved start fresh.
function backupData(){
  if (!stUsed()) return S;
  const d = JSON.parse(JSON.stringify(S));
  d.log = d.log.map(e => { const x = Object.assign({}, e); delete x.mins; delete x.goal; delete x.avg; delete x.src;
    x.tier = 'restored'; x.notes = (x.notes || []).filter(n => !/streak/i.test(n)); return x; });
  d.streak = 0; d.best = 0; delete d.tbPrev;
  if (d.trophies) for (const k in d.trophies) if (/^(st|tb)/.test(k)) delete d.trophies[k];
  return d;
}
function backupCode(){ return 'LIFETIME-' + btoa(unescape(encodeURIComponent(JSON.stringify(backupData())))); }
function readBackup(code){
  try {
    code = (code || '').replace(/\s+/g, '');
    if (code.indexOf('LIFETIME-') !== 0) return null;
    const d = JSON.parse(decodeURIComponent(escape(atob(code.slice(9)))));
    return d && d.name && typeof d.age === 'number' && Array.isArray(d.log) ? d : null;
  } catch(e) { return null; }
}
function restoreModal(){
  modal('<h2>Restore a backup</h2><p class="muted">Paste your backup code below.'+(S ? ' This replaces '+esc(S.name)+'.' : '')+'</p>'+
    '<textarea class="code" id="rcode" placeholder="LIFETIME-..."></textarea><p class="muted small" id="rerr"></p>'+
    '<button class="btn" id="rgo">Restore</button><button class="btn ghost" data-close style="margin-top:8px">Cancel</button>');
  $('rgo').onclick = () => {
    const d = readBackup($('rcode').value);
    if (!d) { $('rerr').textContent = 'That code didn\'t work. Make sure you copied all of it.'; return; }
    S = migrate(d); save(); tab = 'home';
    document.querySelectorAll('.modal').forEach(m => m.remove());
    catchUp(); render(); updateIcon();
    modal('<div class="birth">'+charSVG(S)+'</div><h2>'+esc(S.name)+' is back!</h2><p>Age '+S.age+', right where you left off.</p><button class="btn" data-close>Yay</button>');
    confetti(['💖','✨','🎉']);
  };
}
function addReminder(kind){
  const [hh, mm] = ($('rtime').value || '21:00').split(':').map(Number);
  const start = new Date(); start.setHours(hh, mm, 0, 0);
  const end = new Date(start.getTime() + 5*60000);
  const p = n => String(n).padStart(2, '0');
  const local = d => d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00';
  const title = 'Check in on '+S.name+' 🌱', url = location.href.split('#')[0].split('?')[0];
  const details = 'How much screen time today? Open Blip and see what kind of year '+S.name+' has: '+url;
  if (kind === 'google') {
    window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+
      '&dates='+local(start)+'/'+local(end)+'&recur='+encodeURIComponent('RRULE:FREQ=DAILY')+'&details='+encodeURIComponent(details), '_blank');
    return;
  }
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Blip//EN','BEGIN:VEVENT',
    'UID:lifetime-'+Date.now()+'@gamesbyvidal.github.io','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',
    'DTSTART:'+local(start),'DTEND:'+local(end),'RRULE:FREQ=DAILY','SUMMARY:'+title,'DESCRIPTION:'+details,'URL:'+url,
    'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+title,'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  a.download = 'lifetime-reminder.ics';
  document.body.appendChild(a); a.click(); a.remove();
}

function confetti(set){
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('div');
