<body>
<div class="app" id="app"></div>
<nav class="nav hide" id="nav"><div>
  <button data-tab="home" class="on"><b>🏠</b>Today</button>
  <button data-tab="story"><b>🏡</b>Blip's life</button>
  <button data-tab="settings"><b>⚙️</b>Settings</button>
</div></nav>

<script>
// ============ SETTINGS ============
// Change these numbers to tune the game.
const SETTINGS = {
  lifeLength: 80,          // the story ends (and a new generation begins) at this age
  greatIfUnder: 0.5,       // under half your goal = an amazing year
  mehIfOver: 1.25,         // up to 25% over your goal = a so-so year
  awfulIfOver: 2,          // more than double your goal = a disaster year
  streakBonuses: {3: 2, 7: 4, 14: 6, 30: 10},  // streak length: bonus points to every stat
  maxSkippedYears: 3       // days without a check-in each cost a rough year, up to this many per break
};

// ============ LIFE EVENTS ============
// Each event: [emoji, what happened, {h: health, s: smarts, j: happiness}]
const EVENTS = {
  baby: {
    good: [
      ['🚀', 'First word was "rocket." Parents are already saving for space camp.', {s:6,j:4}],
      ['🐕', 'Took their first steps, straight toward the dog.', {h:6,j:4}],

// ============ GAME STATE ============
const KEY = 'lifetime-v1';
const SKINS = ['#ffe0c7','#f1c27d','#d9a066','#a86b3c','#6b4226'];
const HAIRS = ['#2b1d14','#6a3e1f','#d8a24a','#c0392b','#3d3d8f'];
let S = load();
let tab = 'home';
let draft = {name:'', skin:SKINS[1], hair:HAIRS[0], avg:240, goal:210, step:0};

function load(){ try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

function newLife(name, skin, hair, goal, gen, bonus){
  const b = bonus || 0;
  return {
    name, skin, hair, goal, gen: gen || 1,
    age: 0, h: 50 + b, s: 50 + b, j: 50 + b, money: 0,
    streak: 0, best: 0, edu: null, eduTier: 0, job: null, pay: 0, talent: null, partner: null,
    used: [], log: [], lastDate: null, testMode: S ? S.testMode : false, done: false
  };
}

function stage(age){
  if (age < 5) return 'baby';
  if (age < 13) return 'kid';
  if (age < 14) return 'middle';
  if (age < 18) return 'teen';
  if (age < 23) return 'young';
  if (age < 65) return 'adult';
  return 'senior';
}
const STAGE_NAMES = {baby:'Baby', kid:'Kid', middle:'Teenager', teen:'Teenager', young:'Young adult', adult:'Adult', senior:'Golden years'};

// A day runs from 4am to 4am, so a check-in just after midnight still counts for the night before.
function today(){ const d = new Date(Date.now() - 4*3600e3); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dayNum(key){ const [y,m,d] = key.split('-').map(Number); return Math.round(Date.UTC(y, m-1, d) / 864e5); }
function dayKey(n){ const d = new Date(n * 864e5); return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate(); }
function canCheckIn(){ return S.testMode || S.lastDate !== today(); }
function clamp(v){ return Math.max(0, Math.min(100, Math.round(v))); }
function fmtTime(m){ const h = Math.floor(m/60), mm = m%60; return h ? (mm ? h+'h '+mm+'m' : h+'h') : mm+'m'; }
function fmtMoney(k){ if (k >= 1000) return '$'+(k/1000).toFixed(k >= 10000 ? 0 : 1)+'M'; return '$'+Math.round(k)+'K'; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ============ ONE YEAR PASSES ============
function tierFor(mins){
  const g = S.goal;
  if (mins <= g * SETTINGS.greatIfUnder) return 'great';
  if (mins <= g) return 'good';
  if (mins <= g * SETTINGS.mehIfOver) return 'meh';
  if (mins <= g * SETTINGS.awfulIfOver) return 'bad';
  return 'awful';
}
function checkIn(mins){
  const tier = tierFor(mins);
  const entry = liveYear(mins, tier);
  S.lastDate = today();
  save();
  render();
  showYear(entry);
}

// One year of the character's life. tier 'skipped' means a day you didn't check in.
function liveYear(mins, tier){
  const g = S.goal;
  const met = tier === 'great' || tier === 'good';

  S.age++;
  const st = stage(S.age);
  const pool = EVENTS[st][met ? 'good' : 'bad'];
  let fresh = pool.filter(e => !S.used.includes(e[1]));
  // Every stage has at least one event per year it lasts, so nothing repeats in a lifetime.
  // (Safety net only: if a pool ever runs dry, allow repeats from it.)
  if (!fresh.length) { S.used = S.used.filter(t => !pool.some(e => e[1] === t)); fresh = pool; }
  const ev = pick(fresh);
  S.used.push(ev[1]);

  const mult = {great:1.5, good:1, meh:0.75, bad:1.5, skipped:1.5, awful:2}[tier];
  const fx = {};
  for (const k in ev[2]) fx[k] = Math.round(ev[2][k] * mult);
  if (S.age > 60) fx.h = (fx.h || 0) - 1; // getting older

  const notes = [];
  if (tier === 'skipped') notes.push(pick(SKIP_LINES).replace('{name}', S.name));
  let streakBonus = 0;
  if (met) {
    S.streak++;
    S.best = Math.max(S.best, S.streak);
    const bonus = SETTINGS.streakBonuses[S.streak];
    if (bonus) {
      streakBonus = bonus;
      notes.push('🔥 '+S.streak+' day streak! +'+bonus+' to everything.');
    }
  } else {
    if (S.streak >= 3) notes.push('💔 Your '+S.streak+' day streak ended.');
    S.streak = 0;
  }
  const shown = applyFx(fx);
  // Gains shrink near 100; flag it so the year card can explain the smaller numbers.
  const shrunk = Object.keys(fx).some(k => fx[k] > 0 && shown[k] < fx[k]);
  // The streak bonus always adds its full amount (only capped at 100).
  for (const k of ['h','s','j']) {
    if (!streakBonus) break;
    const before = S[k];
    S[k] = clamp(S[k] + streakBonus);
    shown[k] = (shown[k] || 0) + (S[k] - before);
  }

  let earned = 0;
  // Good years add to savings. Bad years eat into them (impulse buys, missed work, late fees).
  if (met) { if (S.pay > 0) earned = Math.round(S.pay * 0.3); }
  else earned = -Math.min(S.money, Math.round(Math.max(S.pay * 0.2, S.money * 0.03)));
  S.money += earned;
  const buys = buyThings();

  const ms = milestone(S.age, met);
  if (ms && ms.fx) applyFx(ms.fx);

  const entry = {age:S.age, date:today(), mins, goal:g, tier, emoji:ev[0], text:ev[1], fx: shown, shrunk, earned, notes, ms: ms ? {emoji:ms.emoji, title:ms.title, text:ms.text} : null};
  if (buys.length) entry.buys = buys;
  S.log.push(entry);
  if (S.age >= SETTINGS.lifeLength) S.done = true;
  return entry;
}

// ============ SKIPPED DAYS ============
const SKIP_LINES = [
  '👻 You weren\'t around. {name} spent the year glued to the couch.',
  '👻 No check-in. {name} wandered through the year on autopilot.',
  '👻 You disappeared, so {name} picked up their phone instead.',
  '👻 {name} waited for you all year. You never came.'
];
// Each full day without a check-in is a rough year lived without you (at most a few per break).
function catchUp(){
  if (!S || S.done || S.testMode || !S.lastDate) return;
  const missed = dayNum(today()) - dayNum(S.lastDate) - 1;
  if (missed < 1) return;
  const years = Math.min(missed, SETTINGS.maxSkippedYears);
  const entries = [];
  for (let i = 0; i < years && !S.done; i++) entries.push(liveYear(null, 'skipped'));
  S.lastDate = dayKey(dayNum(today()) - 1);   // today's check-in is still open
  save();
  render();
  let h = '<div class="banner" style="background:var(--meh)">👻 You were away</div>'+
    '<h2>You missed '+missed+' day'+(missed > 1 ? 's' : '')+'</h2>'+
    '<p>'+esc(S.name)+' lived '+entries.length+' year'+(entries.length > 1 ? 's' : '')+' without you'+(missed > years ? ' (never more than '+years+' per break)' : '')+'.</p>';
  for (const e of entries) {
    h += '<div class="year" style="text-align:left"><div class="age"><b>'+e.age+'</b>age</div><div class="what"><div class="t">'+e.emoji+' '+esc(e.text)+'</div>'+
      '<div class="fx" style="justify-content:flex-start">'+fxHTML(e.fx, e.earned)+'</div>'+
      (e.ms ? '<div class="ms"><b>'+e.ms.emoji+' '+esc(e.ms.title)+'</b><br><span class="muted">'+esc(e.ms.text)+'</span></div>' : '')+'</div></div>';
  }
  h += '<p class="muted">Check in every day so you don\'t miss their life.</p><button class="btn" data-close>'+(S.done ? 'See how their life went' : 'Check in for today')+'</button>';
  modal(h);
}

// Gains shrink as a stat nears 100, so it takes steady good days to stay on top.
function applyFx(fx){
  const real = {};
  for (const k in fx) {
    let v = fx[k];
    if (v > 0 && k !== 'money') v = Math.max(1, Math.round(v * Math.min(1, (100 - S[k]) / 50)));
    const before = S[k];
    S[k] = clamp(S[k] + v);
    real[k] = S[k] - before;
  }
  return real;
}

// ============ BIG LIFE MOMENTS ============
// A big life moment only goes well if you hit your goal that day AND the stats are good enough.
function milestone(age, met){
  const avg = (S.h + S.s + S.j) / 3;
  if (age === 5) return met && S.j >= 50
    ? {emoji:'🎒', title:'First day of school', text:'Walked in like they owned the place. Made three friends by lunch.', fx:{j:4}}
    : {emoji:'🎒', title:'First day of school', text:'Cried at the door for twenty minutes. Eventually made one friend.', fx:{j:-3}};

  if (age === 10) {
    if (!met) {
      S.talent = 'gamer';
      return {emoji:'🕹️', title:'Talent discovered: Video games', text:'Can beat any level in under a minute. Cannot do a single push-up.', fx:{h:-3}};
    }
    const top = [['h',S.h],['s',S.s],['j',S.j]].sort((a,b) => b[1]-a[1])[0][0];
    S.talent = {h:'athlete', s:'scientist', j:'performer'}[top];
    return {
      h:{emoji:'⚡', title:'Talent discovered: Sports', text:'Fastest kid in the whole school. Coaches are already asking about them.'},
      s:{emoji:'🤖', title:'Talent discovered: Science', text:'Built a working robot out of an old vacuum cleaner.'},
      j:{emoji:'🎤', title:'Talent discovered: Performing', text:'Stole the show in the school play. Standing ovation.'}
    }[top];
  }

  if (age === 14) return met
    ? {emoji:'🏫', title:'First day of high school', text:'Joined three clubs and found their crew by lunch.', fx:{j:6}}
    : {emoji:'🏫', title:'First day of high school', text:'Walked into the wrong classroom. Twice. Was staring at their phone both times.', fx:{j:-4}};

  if (age === 16) return met && (S.h + S.s)/2 >= 50
    ? {emoji:'🚗', title:'Driving test', text:'Passed on the first try! Freedom!', fx:{j:8}}
    : {emoji:'🚧', title:'Driving test', text:'Failed. Ran over a cone. Then a second cone. Then the mailbox.', fx:{j:-5}};

  if (age === 18) {
    let tier = S.s >= 75 ? 3 : S.s >= 55 ? 2 : S.s >= 35 ? 1 : 0;
    const bombed = !met && tier > 0;
    if (bombed) tier--;
    const why = bombed ? 'Stayed up scrolling the night before the entrance exam and bombed it. ' : '';
    if (tier === 3) { S.edu = 'Starfield University'; S.eduTier = 3; return {emoji:'🎓', title:'Got into their dream school!', text:'Accepted to Starfield University, one of the best in the world.', fx:{j:10}}; }
    if (tier === 2) { S.edu = 'State University'; S.eduTier = 2; return {emoji:'🎓', title:'Off to college', text:why+'Accepted to State University. Go Mighty Moose!', fx:{j: bombed ? 0 : 6}}; }
    if (tier === 1) { S.edu = 'Community College'; S.eduTier = 1; return {emoji:'📘', title:'Community college', text:why+'Didn\'t get into the big schools, but enrolled at the community college.', fx:{j: bombed ? -3 : 0}}; }
    S.job = 'Burger Barn cashier'; S.pay = 20;
    return {emoji:'🍔', title:'No college', text:why+(bombed ? 'Now working the fryer at Burger Barn.' : 'Grades were too low to get in anywhere. Now working the fryer at Burger Barn.'), fx:{j:-6}};
  }

  if (age === 22) {
    let score = S.s*0.6 + S.h*0.2 + S.j*0.2 + S.eduTier*8;
    if (!met) score -= 20;
    const why = met ? '' : 'Overslept the big interview after scrolling all night. ';
    let job, pay, text;
    if (met && S.talent === 'athlete' && S.h >= 85) { job='Pro soccer player'; pay=900; text='Signed with a pro team! Their face is on a cereal box.'; }
    else if (met && S.talent === 'scientist' && S.s >= 85 && S.eduTier >= 2) { job='Rocket scientist'; pay=250; text='Hired by a space company to build rockets. Literally rocket science.'; }
    else if (met && S.talent === 'performer' && S.j >= 85) { job='Movie star'; pay=1000; text='Discovered at a coffee shop. Now starring in a superhero movie.'; }
    else if (score >= 80) { [job,pay] = pick([['Doctor',220],['Software engineer',180],['Airline pilot',200]]); text='Landed a dream job as a '+job.toLowerCase()+'.'; }
    else if (score >= 65) { [job,pay] = pick([['Architect',110],['Video game designer',120],['Nurse',95]]); text='Got a great job as a '+job.toLowerCase()+'.'; }
    else if (score >= 50) { [job,pay] = pick([['Electrician',80],['Teacher',65],['Chef',60]]); text=why+'Found a job as a '+job.toLowerCase()+'.'; }
    else if (score >= 35) { [job,pay] = pick([['Delivery driver',45],['Call center agent',38]]); text=why+'Took a job as a '+job.toLowerCase()+'. It pays the bills. Mostly.'; }
    else { job='Seasonal mall Santa'; pay=20; text=why+'The only job they could get: mall Santa. It\'s July.'; }
    S.job = job; S.pay = pay;
    return {emoji:'💼', title:'First real job: '+job, text, fx:{j: !met ? -4 : pay >= 100 ? 8 : pay >= 50 ? 3 : -4}};
  }

  if (age === 28) {
    if (met && S.j >= 60) { S.partner = pick(['Sam','Alex','Jordan','Riley','Casey','Morgan']); return {emoji:'💞', title:'Found their person', text:'Met '+S.partner+' at a rock climbing gym. It was love at first belay.', fx:{j:12}}; }
    return {emoji:'🐈', title:'Still single', text:'Adopted a cat named Gerald instead. Gerald does not like them.', fx:{j:-2}};
  }

  if (age === 35 && S.job) {
    if (met && avg >= 65) { S.pay = Math.round(S.pay*1.6); S.job = 'Senior ' + S.job.toLowerCase(); return {emoji:'🚀', title:'Big promotion!', text:'Promoted to '+S.job+'. Corner office unlocked.', fx:{j:8}}; }
    if (avg < 35 || (!met && avg < 50)) { S.pay = Math.round(S.pay*0.5); return {emoji:'📦', title:'Fired!', text:'Got caught scrolling during the big meeting. Now doing part time work.', fx:{j:-10}}; }
    if (!met) return {emoji:'🪑', title:'Passed over', text:'The promotion went to the coworker who doesn\'t check their phone in meetings.', fx:{j:-5}};
  }

  if (age === 45) return met && S.h >= 60
    ? {emoji:'🏅', title:'Midlife glow up', text:'Ran a full marathon at 45. Kids are mildly impressed.', fx:{j:6}}
    : {emoji:'🏍️', title:'Midlife crisis', text:'Bought a motorcycle. Can\'t ride it. It lives in the garage now.', fx:{j:-4}};

  if (age === 65) {
    let tier = netWorth() >= 2000 ? 2 : netWorth() >= 700 ? 1 : 0;
    const scammed = !met && tier > 0;
    if (scammed) { tier--; S.money = Math.round(S.money * 0.6); }
    const why = scammed ? 'Lost a big chunk of savings to an online scam right before retiring. ' : '';
    if (tier === 2) { S.job = 'Retired'; S.pay = 0; return {emoji:'🏝️', title:'Retired in style', text:'Retired to a beach house in Hawaii. Wears flip flops full time.', fx:{j:12}}; }
    if (tier === 1) { S.job = 'Retired'; S.pay = 0; return {emoji:'🌻', title: scammed ? 'Retired, barely' : 'Happy retirement', text: scammed ? why+'Still retired, but the garden got a lot smaller.' : 'Retired comfortably with a big garden and a porch swing.', fx:{j: scammed ? -3 : 8}}; }
    S.job = 'Mega-Mart greeter'; S.pay = 25;
    return {emoji:'🛒', title:'Can\'t afford to retire', text:why+'Didn\'t save enough. Now a greeter at Mega-Mart. Waves a lot.', fx:{j:-6}};
  }
  return null;
}

function lifeScore(){
  const avg = (S.h + S.s + S.j) / 3;
  const metDays = S.log.filter(e => e.tier === 'good' || e.tier === 'great').length;
  return Math.round(avg + Math.min(30, netWorth()/200) + metDays/2);
}
function lifeTitle(score){
  if (score >= 120) return ['🏆','A legendary life'];
  if (score >= 95) return ['🌟','An amazing life'];
  if (score >= 70) return ['😊','A pretty good life'];
  if (score >= 45) return ['😐','A so-so life'];
  return ['🥔','A couch potato life'];
}

const STREAK_LINES = ['{n} days in a row! I\'ve never felt this good.', 'Our streak is at {n}! Don\'t stop now!', '{n} day streak! We make a great team.'];
const TICKLE_LINES = ['Okay okay, I\'m awake!', 'That tickles! 😆', 'Hey! Personal space!', 'Stop poking me! ...Okay, one more.'];

let taps = [], bubbleTimer;
function tapCharacter(){
  const wrap = $('buddy');
  if (!wrap) return;
  const now = Date.now();
  taps = taps.filter(t => now - t < 3000); taps.push(now);
  const st = stage(S.age);
  const last = S.log.length ? S.log[S.log.length-1] : null;
  const up = !(last && !(last.tier === 'good' || last.tier === 'great')) && S.j >= 30;
  let line;
  if (taps.length >= 5) line = pick(TICKLE_LINES);
  else if (up && S.streak >= 3 && Math.random() < 0.3) line = pick(STREAK_LINES).replace('{n}', S.streak);
  else line = pick(LINES[st][up ? 'up' : 'down']);
  wrap.classList.remove('hop', 'droop'); void wrap.offsetWidth;
  wrap.classList.add(up ? 'hop' : 'droop');
  const bub = $('bubble');
  bub.textContent = line;
  bub.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bub.classList.remove('show'), 3200);
  if (!S.tapped) { S.tapped = true; save(); const h = $('taphint'); if (h) h.remove(); }
}

const $ = id => document.getElementById(id);
function render(){
  const app = $('app');
  const meet = readMeet();
  if (meet) { $('nav').classList.add('hide'); app.innerHTML = meetHTML(meet); $('raise').onclick = () => { history.replaceState(null, '', location.pathname); tab = 'home'; render(); window.scrollTo(0,0); }; return; }
  if (!S) { $('nav').classList.add('hide'); app.innerHTML = setupHTML(); bindSetup(); return; }
  $('nav').classList.remove('hide');
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'home') app.innerHTML = homeHTML();
  else if (tab === 'story') app.innerHTML = lifeHTML();
  else app.innerHTML = settingsHTML();
  bind();
}

// Big moments coming up, used for the "Coming up" teaser on the Today screen.
const UPCOMING = {5:['🎒','First day of school'], 10:['🌟','A hidden talent shows up'], 14:['🏫','First day of high school'], 16:['🚗','Driving test'],
  18:['🎓','College decisions'], 22:['💼','First real job'], 28:['💞','Love life'], 35:['📈','Big career moment'], 45:['🪞','Midlife'], 65:['🏖️','Retirement']};
function nextBig(after){
  const ages = Object.keys(UPCOMING).map(Number).filter(a => a > after);
  if (ages.length) return [ages[0]].concat(UPCOMING[ages[0]]);
  return after < SETTINGS.lifeLength ? [SETTINGS.lifeLength, '🎂', 'The final chapter'] : null;
}
const VERDICT = {
  great: ['🌟', 'Way under your goal. Amazing year!', '#fff6d6', '#9a6b00'],
  good:  ['✅', 'Under your goal. {name} has a good year!', '#e4f7ee', '#148a55'],
  meh:   ['😐', 'A little over your goal. So-so year.', '#f0eef6', '#5f5a77'],
  bad:   ['⚠️', 'Over your goal. Rough year ahead.', '#fff0f0', '#c23c3c'],
  awful: ['💥', 'Way over your goal. Disaster year.', '#ffe6ec', '#a01d3e']
};
function verdictHTML(mins){
  const v = VERDICT[tierFor(mins)];
  return '<div class="verdict" id="verdict" style="background:'+v[2]+';color:'+v[3]+'">'+v[0]+' '+v[1].replace('{name}', esc(S.name))+'</div>';
}
function weekHTML(){
  const open = canCheckIn() && !S.done;
  const days = S.log.slice(open ? -6 : -7);
  let cells = days.map(e => '<div><span class="'+e.tier+'"></span>'+e.age+'</div>').join('');
  if (open) cells += '<div class="next"><span></span>'+(S.age+1)+'</div>';
  const keys = Object.keys(SETTINGS.streakBonuses).map(Number).sort((a, b) => a - b);
  const next = keys.find(k => k > S.streak);
  let nudge;
  if (!S.streak) nudge = 'Hit your goal today to start a streak 🔥';
  else nudge = '🔥 '+S.streak+' day streak'+(next ? ' · <b>'+(next - S.streak)+' more day'+(next - S.streak > 1 ? 's' : '')+' for a +'+SETTINGS.streakBonuses[next]+' bonus</b>' : ' · <b>Legendary!</b>');
  return '<div class="card"><div class="week">'+cells+'</div><div class="nudge">'+nudge+'</div></div>';
}
function teaserHTML(after){
  const nb = nextBig(after);
  if (!nb) return '';
  if (!canCheckIn()) {
    const turning = S.age + 1, big = nb[0] === turning;
    return '<div class="tease"><div class="e">🎂</div><div><b>Tomorrow '+esc(S.name)+' turns '+turning+'</b><span>'+(big ? nb[2]+'! '+nb[1] : 'Coming up at '+nb[0]+': '+nb[2]+' '+nb[1])+'</span></div></div>';
  }
  const soon = nb[0] === S.age + 1;
  return '<div class="tease"><div class="e">'+nb[1]+'</div><div><b>'+(soon ? 'This year: ' : 'Coming up at '+nb[0]+': ')+nb[2]+'</b><span>'+(soon ? 'Hit your goal today so it goes well!' : 'Hit your goal that day so it goes well!')+'</span></div></div>';
}

function fxHTML(fx, earned){
  const names = {h:'💪', s:'🧠', j:'😊'};

}

// ============ THINGS A BLIP BUYS WITH THEIR SAVINGS ============
// Bought automatically, one per year, in this order, once the Blip is 18+.
// Homes trade in at full value, cars at half. Money is in $K like S.money.
const LADDER = [
  {key:'hatch',     kind:'car',  name:'used hatchback',    price:15},
  {key:'starter',   kind:'home', name:'starter home',      price:100},
  {key:'trip',      kind:'trip', name:'dream trip',        price:20, fx:{j:15}},
  {key:'suv',       kind:'car',  name:'family SUV',        price:40},
  {key:'family',    kind:'home', name:'family house',      price:250},
  {key:'dreamcar',  kind:'car',  name:'dream convertible', price:90},
  {key:'dreamhome', kind:'home', name:'dream home',        price:600}
];
const ITEM = Object.fromEntries(LADDER.map(x => [x.key, x]));
const CAR_KEY = {hatch:'hatch', suv:'suv', dreamcar:'dream'};       // item -> CAR_ART
const HOME_KEY = {starter:'starter', family:'family', dreamhome:'dream'}; // item -> HOME_ART
const ITEM_ICON = {starter:'house', family:'bighouse', dreamhome:'mansion', trip:'plane'};
function owned(){ return S.owned || (S.owned = {car:null, home:null, bought:[]}); }
function tradeIn(item){
  const o = owned();
  if (item.kind === 'car' && o.car) return ITEM[o.car].price / 2;
  if (item.kind === 'home' && o.home) return ITEM[o.home].price;
  return 0;
}
function nextItem(){ const o = owned(); return LADDER.find(x => !o.bought.some(b => b.key === x.key)) || null; }
function itemCost(item){ return Math.max(0, item.price - tradeIn(item)); }
function netWorth(){
  const o = owned();
  return S.money + (o.home ? ITEM[o.home].price : 0) + (o.car ? ITEM[o.car].price / 2 : 0);
}
function buyThings(){
  const item = nextItem();
  if (!item || S.age < 18) return [];
  const cost = itemCost(item);
  if (S.money < cost) return [];
  const o = owned();
  S.money -= cost;
  if (item.kind === 'car') o.car = item.key;
  if (item.kind === 'home') o.home = item.key;
  if (item.fx) applyFx(item.fx);
  o.bought.push({key:item.key, age:S.age});
  return [{key:item.key, cost, traded:item.price - cost}];
}
function itemArt(key, cls){
  if (CAR_KEY[key]) return '<svg class="'+(cls||'')+'" viewBox="0 0 200 120">'+CAR_ART[CAR_KEY[key]].svg+'</svg>';
  return '<svg class="'+(cls||'')+'" viewBox="0 0 100 100">'+ICONS[ITEM_ICON[key]]+'</svg>';
}
function pron(){ return S.girl ? 'her' : 'his'; }
function buyLine(b){
  const it = ITEM[b.key];
  if (it.kind === 'trip') return esc(S.name)+' went on '+pron()+' dream trip! ✈️';
  if (b.key === 'hatch') return esc(S.name)+' bought '+pron()+' first car!';
  if (b.key === 'starter') return esc(S.name)+' bought '+pron()+' first home!';
  return esc(S.name)+' bought a '+it.name+'!';
}

// Where the Blip lives right now, and where things go in each scene (percent of the scene box).

  parents:   {blip:[3, 4],  car:null},

  const o = owned();
  const key = S.age < 18 ? 'parents' : (o.home ? HOME_KEY[o.home] : 'apartment');
  const L = SCENE_LAYOUT[key], home = HOME_ART[key];
  const car = (o.car && L.car) ? '<svg x="'+L.car[0]+'" y="'+L.car[1]+'" width="'+L.car[2]+'" height="'+(L.car[2]*.6)+'" viewBox="0 0 200 120">'+CAR_ART[CAR_KEY[o.car]].svg+'</svg>' : '';
  const label = key === 'parents' ? 'Mom and Dad\'s house' : key === 'apartment' ? 'First apartment' : home.title;
  return '<div class="lifescene"><svg viewBox="0 0 360 220" class="scene">'+home.svg+car+'</svg>'+
    '<div class="sblip" style="left:'+L.blip[0]+'%;bottom:'+L.blip[1]+'%">'+charSVG(S)+'</div><div class="where">'+(key === 'parents' ? '🏡' : '📍')+' '+esc(label)+'</div></div>';
}

function lifeHTML(){
  const o = owned(), nxt = nextItem();
  let earned = '<div class="card"><h2 class="earnh">💰 Earned by '+esc(S.name)+'<small>Net worth '+fmtMoney(netWorth())+'</small></h2>';
  earned += '<div class="muted small">Savings '+fmtMoney(S.money)+'. '+esc(S.name)+' buys things automatically. Only good habits grow it.</div>';
  if (o.bought.length) earned += o.bought.map(b => '<div class="own">'+itemArt(b.key, CAR_KEY[b.key] ? 'oicon car' : 'oicon')+'<span>'+ITEM[b.key].name.replace(/^./, c => c.toUpperCase())+
    ((o.car === b.key || o.home === b.key || b.key === 'trip') ? '' : ' <i>traded in</i>')+'</span><span class="a">age '+b.age+'</span></div>').join('');
  if (S.age < 18) earned += '<p class="nexttxt">'+esc(S.name)+' starts earning at 18. First up: a '+LADDER[0].name+'.</p>';
  else if (nxt) {
    const cost = itemCost(nxt), pct = Math.min(100, Math.round(S.money / cost * 100));
    earned += '<div class="nexttxt">Next: '+itemArt(nxt.key, 'nicon')+' <b>'+nxt.name.replace(/^./, c => c.toUpperCase())+'</b> · '+(S.money >= cost ? 'buying soon!' : fmtMoney(cost - S.money)+' to go')+
      (tradeIn(nxt) ? '<br><span class="muted small">'+fmtMoney(nxt.price)+' minus '+fmtMoney(tradeIn(nxt))+' trade-in</span>' : '')+
      '<i class="nbar"><u style="width:'+pct+'%"></u></i></div>';
  } else earned += '<p class="nexttxt">🌟 '+esc(S.name)+' has everything '+(S.girl ? 'she' : 'he')+' ever dreamed of!</p>';
  earned += '</div>';
  return header().replace('<div class="logo">Lifetime<small>One day for you. One year for them.</small></div>', '<div class="logo">'+esc(S.name)+'\'s life<small>Age '+S.age+(S.job ? ' · '+esc(S.job) : '')+'</small></div>')+
    '<div class="card scenecard">'+homeScene()+'</div>'+earned+storyHTML(true);
}

// ============ SETUP (one step at a time) ============
// Steps: 0 two futures, 1 boy or girl, 2 name, 3 look, 4 goal, 5 promise
const SETUP_STEPS = 6;
function previewSVG(age, extra){
  return charSVG(Object.assign({name: draft.name || 'them', age, log: [], h: 60, s: 50, j: 70, skin: draft.skin, hair: draft.hair, girl: !!draft.girl}, extra || {}));
}
function setupHTML(){
  const step = draft.step || 0, name = esc(draft.name || 'them');
  const dots = '<div class="dots">'+Array.from({length: SETUP_STEPS}, (_, i) => '<i class="'+(i <= step ? 'on' : '')+'"></i>').join('')+'</div>';
  const back = step > 0 ? '<button class="backbtn" id="back">‹ Back</button>' : '';
  const top = '<div class="setuptop">'+back+dots+'</div>';
  if (step === 0) {
    const nextGen = draft.gen > 1;
    return '<div class="intro"><h1>Lifetime</h1><p>One day for you is one year for them.</p></div>'+
      '<div class="card futures"><div class="row">'+
        '<div class="future up">'+previewSVG(30, {job:'Doctor', pay:200, log:[{tier:'good'}], j:90})+'<b>2 hours a day</b><span>Doctor, marathon runner, happy</span></div>'+
        '<div class="future down">'+previewSVG(30, {log:[{tier:'awful'}], j:20})+'<b>7 hours a day</b><span>Tired, broke, glued to the couch</span></div>'+
      '</div><h2>Which life will they live?</h2><p class="muted">Every day you hit your screen time goal, your Blip has a great year. Every day you miss it... less great. '+(nextGen ? 'Time to raise the next generation.' : 'It\'s up to you.')+'</p>'+
      '<button class="btn" id="next">'+(nextGen ? 'Meet the next generation' : 'Meet your Blip')+' →</button>'+
      (nextGen ? '' : '<button class="linkbtn" id="restore">Have a backup code? Restore it</button>')+'</div>';
  }
  if (step === 1) return top+'<div class="card"><h2 class="big">Boy or girl?</h2><div class="row">'+[false,true].map(g=>'<button class="pick'+(draft.girl === g ? ' on' : '')+'" data-girl="'+g+'">'+
      charSVG({name:g?'Girl':'Boy', age:8, log:[], h:60, s:50, j:70, skin:draft.skin, hair:draft.hair, girl:g})+(g?'Girl':'Boy')+'</button>').join('')+'</div></div>';
  if (step === 2) return top+'<div class="card center"><div class="bigprev">'+previewSVG(8)+'</div><h2 class="big">What\'s their name?</h2>'+
      '<input type="text" id="nm" maxlength="20" placeholder="Their name" value="'+esc(draft.name)+'" autocomplete="off"><button class="btn alt" id="next">Next →</button></div>';
  if (step === 3) return top+'<div class="card center"><div class="bigprev">'+previewSVG(8)+'</div><h2 class="big">How does '+name+' look?</h2>'+
      '<h2 class="sm">Skin</h2><div class="swatches">'+SKINS.map(c=>'<button class="sw'+(c===draft.skin?' on':'')+'" data-skin="'+c+'" style="background:'+c+'" aria-label="skin color"></button>').join('')+'</div>'+
      '<h2 class="sm">Hair</h2><div class="swatches">'+HAIRS.map(c=>'<button class="sw'+(c===draft.hair?' on':'')+'" data-hair="'+c+'" style="background:'+c+'" aria-label="hair color"></button>').join('')+'</div>'+
      '<button class="btn alt" id="next">Next →</button></div>';
  if (step === 4) return top+'<div class="card"><h2 class="big">How much screen time do you average a day?</h2>'+
      '<div class="goalval" id="av">'+fmtTime(draft.avg)+'</div><input type="range" id="avg" min="30" max="720" step="15" value="'+draft.avg+'">'+
      '<details><summary>Where do I find this?</summary><ul><li><b>iPhone:</b> Settings → Screen Time. It shows your Daily Average.</li><li><b>Android:</b> Settings → Digital Wellbeing &amp; parental controls.</li></ul></details>'+
      '<div class="goalbox"><div class="muted">Your daily goal</div><div class="stepper"><button id="minus">–</button><div class="goalval" id="gv">'+fmtTime(draft.goal)+'</div><button id="plus">+</button></div>'+
      '<div id="saved" class="saved">'+savedLine()+'</div></div>'+
      '<button class="btn alt" id="next">Next →</button></div>';
  return top+'<div class="card center"><div class="bigprev">'+previewSVG(0)+'</div><h2 class="big">Ready to bring '+name+' to life?</h2>'+
      '<p class="muted">Check in every night with your screen time. Stay at '+fmtTime(draft.goal)+' or less and '+name+' gets a great year.</p>'+
      '<button class="btn promise" id="start">I promise to give '+name+' a good life 🤞</button></div>';
}
function savedLine(){
  const diff = draft.avg - draft.goal;
  if (diff <= 0) return 'Try a goal a little below your average. That\'s where the magic happens.';
  const hrs = Math.round(diff * 365 / 60);
  return 'That\'s <b>'+hrs+' hours a year</b> back, about <b>'+Math.round(hrs/24)+' full days</b>.';
}
function goStep(n){ draft.step = Math.max(0, Math.min(SETUP_STEPS - 1, n)); render(); window.scrollTo(0, 0); }

function bindSetup(){
  const step = draft.step || 0;
  if ($('back')) $('back').onclick = () => goStep(step - 1);
  document.querySelectorAll('[data-girl]').forEach(b => b.onclick = () => { draft.girl = b.dataset.girl === 'true'; render(); setTimeout(() => goStep(2), 250); });
  document.querySelectorAll('[data-skin]').forEach(b => b.onclick = () => { draft.skin = b.dataset.skin; render(); });
  document.querySelectorAll('[data-hair]').forEach(b => b.onclick = () => { draft.hair = b.dataset.hair; render(); });
  if ($('nm')) {
    $('nm').oninput = e => { draft.name = e.target.value; };
    $('nm').onkeydown = e => { if (e.key === 'Enter') $('next').click(); };
  }
  if ($('avg')) {
    const update = () => { $('av').textContent = fmtTime(draft.avg); $('gv').textContent = fmtTime(draft.goal); $('saved').innerHTML = savedLine(); };
    $('avg').oninput = e => { draft.avg = +e.target.value; draft.goal = Math.max(15, draft.avg - 30); update(); };
    $('minus').onclick = () => { draft.goal = Math.max(15, draft.goal - 15); update(); };
    $('plus').onclick = () => { draft.goal = Math.min(720, draft.goal + 15); update(); };
  }
  if ($('next')) $('next').onclick = () => {
    if (step === 2) {
      draft.name = $('nm').value.trim();
      if (!draft.name) { $('nm').focus(); $('nm').style.borderColor = 'var(--bad)'; return; }
    }
    goStep(step + 1);
  };
  if ($('restore')) $('restore').onclick = restoreModal;
  if ($('start')) $('start').onclick = () => {
    const name = draft.name.trim();
    const keepTest = draft.testMode || false;
    S = newLife(name, draft.skin, draft.hair, draft.goal, draft.gen, draft.bonus);
    S.girl = !!draft.girl;
    S.avg = draft.avg;
    S.testMode = keepTest;
    save(); tab = 'home'; render(); updateIcon();
    modal('<div class="birth">'+charSVG(S)+'</div><h2>'+esc(name)+' is born!</h2>'+
      '<div class="firstword">"'+esc(pick(LINES.baby.up))+'"</div>'+
      '<p>Every day you hit your goal, '+esc(name)+' has a great year. Check in tonight to start year one.</p><button class="btn" data-close>Let\'s go</button>');
    confetti(['👶','🎉','✨','🍼','💖']);
  };
}

let cdTimer;
function bind(){
  clearInterval(cdTimer);
  if ($('buddy')) $('buddy').onclick = tapCharacter;
  if ($('share')) $('share').onclick = shareLife;
  if ($('tslide')) {
    const set = m => { m = Math.max(0, Math.min(960, m)); homeMins = m; $('tslide').value = m; $('tval').textContent = fmtTime(m); $('verdict').outerHTML = verdictHTML(m); };
    $('tslide').oninput = e => set(+e.target.value);
    $('tminus').onclick = () => set(Math.ceil(+$('tslide').value / 15) * 15 - 15);
    $('tplus').onclick = () => set(Math.floor(+$('tslide').value / 15) * 15 + 15);
  }
  if ($('go')) $('go').onclick = () => { const m = +$('tslide').value; homeMins = null; checkIn(m); };
  if ($('cd')) { const tick = () => { const n = new Date(), m = new Date(n); m.setHours(4,0,0,0); if (m <= n) m.setDate(m.getDate()+1); const s = Math.floor((m-n)/1000);
      $('cd') && ($('cd').textContent = String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'));
      if (s <= 0) render(); }; tick(); cdTimer = setInterval(tick, 1000); }
  if ($('goal')) $('goal').oninput = e => { S.goal = +e.target.value; $('gv').textContent = fmtTime(S.goal); save(); };
  if ($('nm')) $('nm').onchange = e => { const v = e.target.value.trim(); if (v) { S.name = v; save(); } };
  if ($('tm')) $('tm').onchange = e => { S.testMode = e.target.checked; save(); };
  if ($('bkcopy')) $('bkcopy').onclick = () => {
    S.backedUp = new Date().toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}); save();
    const code = backupCode();
    const done = () => { $('bkcopy').textContent = '✓ Copied! Paste it somewhere safe'; };
    const fallback = () => modal('<h2>Your backup code</h2><p class="muted">Select all of it, copy it, and paste it somewhere safe.</p><textarea class="code" readonly>'+code+'</textarea><button class="btn" data-close>Done</button>');
    try { navigator.clipboard.writeText(code).then(done, fallback); } catch(e) { fallback(); }
  };
  if ($('restore')) $('restore').onclick = restoreModal;
  document.querySelectorAll('.lcbtn').forEach(b => b.onclick = () => showLifeCard(+b.dataset.age));
  if ($('ics')) $('ics').onclick = () => addReminder('ics');
  if ($('gcal')) $('gcal').onclick = () => addReminder('google');
  if ($('reset')) $('reset').onclick = () => {
    if (!confirm('Erase '+S.name+' and start a new life?')) return;
    draft = {name:'', skin:S.skin, hair:S.hair, girl:S.girl, avg:S.avg || S.goal + 30, goal:S.goal, step:0, testMode:S.testMode};
    S = null; save(); try { localStorage.removeItem(KEY); } catch(e){}
    render();
  };
  if ($('nextGen')) $('nextGen').onclick = () => {
    const bonus = Math.min(15, Math.round(lifeScore()/10));
    draft = {name:'', skin:S.skin, hair:S.hair, girl:S.girl, avg:S.avg || S.goal + 30, goal:S.goal, gen:S.gen+1, bonus, step:0, testMode:S.testMode};
    S = null; try { localStorage.removeItem(KEY); } catch(e){}
    render();
  };
}

function showYear(e){
  const t = TIER[e.tier];
  let h = '<div class="banner" style="background:'+t.color+'">'+t.label+'</div>'+
    '<div class="agebig">'+esc(S.name)+' is now<b>'+e.age+'</b></div>'+

    '<div class="t">'+buyLine(b)+'</div><p>−'+fmtMoney(b.cost)+' from savings'+(b.traded ? ' (after a '+fmtMoney(b.traded)+' trade-in)' : '')+(ITEM[b.key].fx ? ' · +'+ITEM[b.key].fx.j+' 😊' : '')+'</p></div>';
  if (e.ms) h += '<div class="mscard"><div class="k">Big life moment</div><div class="e">'+e.ms.emoji+'</div><div class="t">'+esc(e.ms.title)+'</div><p>'+esc(e.ms.text)+'</p></div>';
  if (S.done) h += '<div class="mscard"><div class="k">The end of an era</div><div class="e">🎂</div><div class="t">'+esc(S.name)+' turned '+SETTINGS.lifeLength+'!</div><p>Their story is complete. See how it went on the Today screen.</p></div>';
  const card = LIFE_CARD_AGES.includes(e.age);

  else if (e.tier === 'great' || e.ms) confetti(e.tier === 'great' ? ['🎉','⭐','✨','🎊'] : [e.ms.emoji,'✨']);

// ============ HOME SCREEN ICON ============
// The icon is drawn from the player's own character (their skin, hair, boy or girl).
// Phones copy the icon when "Add to Home Screen" is tapped, so we keep it current.
function iconSVG(c){
  const kid = {name:c.name, age:8, log:[{tier:'great'}], h:80, s:70, j:90, skin:c.skin, hair:c.hair, girl:!!c.girl};
  const face = charSVG(kid).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '');
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="512" height="512">'+
    '<defs><linearGradient id="ibg" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#2b2350"/></linearGradient></defs>'+
    '<rect width="130" height="130" fill="url(#ibg)"/><g transform="translate(-35 -15)">'+face+'</g></svg>';
}
let iconURL = '';
function updateIcon(){
  if (!S) return;
  try {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas'); cv.width = cv.height = 512;
      cv.getContext('2d').drawImage(img, 0, 0, 512, 512);
      iconURL = cv.toDataURL('image/png');
      document.querySelectorAll('link[rel=apple-touch-icon],link[rel=icon]').forEach(l => l.href = iconURL);
      const base = location.href.split('#')[0].split('?')[0];
      const man = {name:'Lifetime', short_name:'Lifetime', start_url:base, scope:base.replace(/[^/]*$/, ''), display:'standalone',
        background_color:'#2b2350', theme_color:'#2b2350', icons:[{src:iconURL, sizes:'512x512', type:'image/png', purpose:'any'}]};
      const ml = document.querySelector('link[rel=manifest]');
      if (ml) ml.href = URL.createObjectURL(new Blob([JSON.stringify(man)], {type:'application/manifest+json'}));
      if ($('iconprev')) $('iconprev').src = iconURL;
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSVG(S));
  } catch(e) {}
}
function isInstalled(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }

// ============ LIFE CARDS (shareable, at 18, 40 and the end) ============
const LIFE_CARD_AGES = [18, 40, SETTINGS.lifeLength];
function bestMoments(upTo){
  const met = e => e.tier === 'good' || e.tier === 'great';
  const score = e => Object.values(e.fx || {}).reduce((a, v) => a + Math.max(0, v), 0);
  const log = S.log.filter(e => e.age <= upTo && met(e));
  const picks = log.filter(e => e.ms).map(e => ({emoji:e.ms.emoji, text:e.ms.title+(/[.!?]$/.test(e.ms.title) ? ' ' : '. ')+e.ms.text, age:e.age, rank:9}))
    .concat(log.map(e => ({emoji:e.emoji, text:e.text, age:e.age, rank:score(e)})));
  return picks.sort((a, b) => b.rank - a.rank).slice(0, 3).sort((a, b) => a.age - b.age);
}
function lifeCardHTML(age){
  const log = S.log.filter(e => e.age <= age);
  const metN = log.filter(e => e.tier === 'good' || e.tier === 'great').length;
  const end = age >= SETTINGS.lifeLength;
  const head = end ? esc(S.name)+' lived '+lifeTitle(lifeScore())[1].toLowerCase()+'!' : age === 18 ? esc(S.name)+' is all grown up!' : esc(S.name)+' hit the big 4-0!';
  const best = bestMoments(age);
  const who = Object.assign({}, S, {age, log:[{tier: metN >= log.length/2 ? 'great' : 'awful'}]});
  return '<div class="lifecard"><div class="k">Lifetime · '+(end ? 'Life story' : 'Milestone')+'</div><div class="age">'+age+'</div><div class="nm">'+head+'</div>'+
    '<div class="pc">'+charSVG(who)+'</div>'+
    (best.length ? '<div class="best"><div class="bh">Best moments</div>'+best.map(b => '<div class="be"><span>'+b.emoji+'</span><div>'+esc(b.text)+'</div></div>').join('')+'</div>' : '')+
    '<div class="foot"><b>Goal met '+metN+' of '+log.length+' days</b><br>gamesbyvidal.github.io/lifetime</div></div>';
}
function showLifeCard(age){
  modal(lifeCardHTML(age)+'<p class="muted small">📸 Screenshot this card to share it</p>'+
    (navigator.share ? '<button class="btn alt" id="lcshare">Share Lifetime</button>' : '')+
    '<button class="btn ghost" data-close style="margin-top:8px">Done</button>', 'lcmodal');
  if ($('lcshare')) $('lcshare').onclick = () => { try { navigator.share({title:'Lifetime', text:'My Blip '+S.name+' just turned '+age+' in Lifetime! My screen time decides how their life goes.', url:location.href.split('#')[0].split('?')[0]}).catch(()=>{}); } catch(e){} };
  confetti(['🎉','⭐','✨','💖']);
}

// ============ SHARING ============
// "Share my week" builds a Wordle-style message. Its link opens a "Meet my person" page
// that carries a small snapshot of the character in the link itself (no server needed).
const SQUARE = {great:'🟩', good:'🟩', meh:'🟨', bad:'🟥', awful:'🟥', skipped:'⬜'};
const isMet = e => e.tier === 'good' || e.tier === 'great';
function appURL(){ return location.href.split('#')[0].split('?')[0]; }
function b64url(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64url(str){ str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; return decodeURIComponent(escape(atob(str))); }
function meetLink(){
  const met = S.log.filter(isMet).length;
  const m = {n:S.name, a:S.age, g:S.girl ? 1 : 0, k:Math.max(0, SKINS.indexOf(S.skin)), r:Math.max(0, HAIRS.indexOf(S.hair)),
    h:S.h, s:S.s, j:S.j, jb:S.job || '', st:S.streak, m:met, t:S.log.length, p:S.pay || 0,
    b:bestMoments(S.age).map(momentRef)};
  return appURL() + '#meet=' + b64url(JSON.stringify(m));
}
// Keep links short: a regular event is stored as "stage.index", a big moment as its emoji and title.
function momentRef(x){
  for (const st in EVENTS) { const i = EVENTS[st].good.findIndex(e => e[1] === x.text); if (i >= 0) return st+'.'+i; }
  const m = x.text.match(/^.*?[.!?](?= |$)/);
  return [x.emoji, m ? m[0] : x.text.slice(0, 60)];
}
function momentFromRef(r){
  if (Array.isArray(r)) return r;
  const [st, i] = String(r).split('.'), e = EVENTS[st] && EVENTS[st].good[+i];
  return e ? [e[0], e[1]] : null;
}
function readMeet(){
  const h = location.hash;
  if (h.indexOf('#meet=') !== 0) return null;
  try {
    const m = JSON.parse(unb64url(h.slice(6)));
    return m && m.n && typeof m.a === 'number' ? m : null;
  } catch(e) { return null; }
}
function weekText(){
  const last = S.log.slice(-7), met = last.filter(isMet).length;
  return 'My Blip '+S.name+' is '+S.age+' in Lifetime 🌱\n'+last.map(e => SQUARE[e.tier] || '⬜').join('')+'\n'+
    met+' of '+last.length+' days on goal'+(S.streak >= 2 ? ' · 🔥 '+S.streak : '')+'\nMeet '+S.name+': '+meetLink();
}
function shareLife(){
  const text = weekText();
  const btn = $('share');
  const copied = () => { if (btn) btn.textContent = '✓ Copied! Paste it in a chat'; };
  const fallback = () => modal('<h2>Share '+esc(S.name)+'</h2><p class="muted">Copy this and paste it in a chat.</p><textarea class="code" readonly>'+esc(text)+'</textarea><button class="btn" data-close>Done</button>');
  if (navigator.share) { navigator.share({text}).catch(() => {}); return; }
  try { navigator.clipboard.writeText(text).then(copied, fallback); } catch(e) { fallback(); }
}
function meetHTML(m){
  const c = {name:m.n, age:m.a, girl:!!m.g, skin:SKINS[m.k] || SKINS[1], hair:HAIRS[m.r] || HAIRS[0], h:m.h, s:m.s, j:m.j, job:m.jb, pay:m.p,
    log:[{tier: m.m >= m.t/2 ? 'great' : 'awful'}]};
  const bar = (label, v) => '<div class="mst"><span>'+label+'</span><i><u style="width:'+Math.max(0, Math.min(100, v))+'%"></u></i></div>';
  const sub = ['Age '+m.a].concat(m.jb ? [esc(m.jb)] : []).concat(m.st >= 2 ? ['🔥 '+m.st+' day streak'] : []).join(' · ');
  const best = (m.b || []).slice(0, 3).map(momentFromRef).filter(Boolean);
  return '<div class="meet"><div class="k">A Blip in Lifetime</div><h1>Meet '+esc(m.n)+'</h1><div class="sub">'+sub+'</div><div class="pc">'+charSVG(c)+'</div>'+
    '<div class="mstats">'+bar('💪 Health', m.h)+bar('🧠 Smarts', m.s)+bar('😊 Joy', m.j)+'</div>'+
    (best.length ? '<div class="mbest"><div class="bh">Best moments</div>'+best.map(x => '<div class="be"><span>'+esc(x[0])+'</span><div>'+esc(x[1])+'</div></div>').join('')+'</div>' : '')+
    '<p class="hook">'+esc(m.n)+'\'s owner hit their screen time goal on <b>'+m.m+' of '+m.t+' days</b>. Every day they did, '+esc(m.n)+' had a great year.</p>'+
    '<button class="cta" id="raise">'+(S ? 'Back to '+esc(S.name)+' →' : 'Raise your own Blip →')+'</button>'+(S ? '' : '<div class="tiny">Free. No sign up.</div>')+'</div>';
}

// ============ BACKUP & REMINDER ============
function backupCode(){ return 'LIFETIME-' + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function readBackup(code){
  try {
    code = (code || '').replace(/\s+/g, '');
    if (code.indexOf('LIFETIME-') !== 0) return null;
    const d = JSON.parse(decodeURIComponent(escape(atob(code.slice(9)))));
    return d && d.name && typeof d.age === 'number' && Array.isArray(d.log) ? d : null;
  } catch(e) { return null; }
}
function restoreModal(){
  modal('<h2>Restore a backup</h2><p class="muted">Paste your backup code below.'+(S ? ' This replaces '+esc(S.name)+'.' : '')+'</p>'+
    '<textarea class="code" id="rcode" placeholder="LIFETIME-..."></textarea><p class="muted small" id="rerr"></p>'+
    '<button class="btn" id="rgo">Restore</button><button class="btn ghost" data-close style="margin-top:8px">Cancel</button>');
  $('rgo').onclick = () => {
    const d = readBackup($('rcode').value);
    if (!d) { $('rerr').textContent = 'That code didn\'t work. Make sure you copied all of it.'; return; }
    S = d; save(); tab = 'home';
    document.querySelectorAll('.modal').forEach(m => m.remove());
    catchUp(); render(); updateIcon();
    modal('<div class="birth">'+charSVG(S)+'</div><h2>'+esc(S.name)+' is back!</h2><p>Age '+S.age+', right where you left off.</p><button class="btn" data-close>Yay</button>');
    confetti(['💖','✨','🎉']);
  };
}
function addReminder(kind){
  const [hh, mm] = ($('rtime').value || '21:00').split(':').map(Number);
  const start = new Date(); start.setHours(hh, mm, 0, 0);
  const end = new Date(start.getTime() + 5*60000);
  const p = n => String(n).padStart(2, '0');
  const local = d => d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00';
  const title = 'Check in on '+S.name+' 🌱', url = location.href.split('#')[0].split('?')[0];
  const details = 'How much screen time today? Open Lifetime and see what kind of year '+S.name+' has: '+url;
  if (kind === 'google') {
    window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+
      '&dates='+local(start)+'/'+local(end)+'&recur='+encodeURIComponent('RRULE:FREQ=DAILY')+'&details='+encodeURIComponent(details), '_blank');
    return;
  }
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Lifetime//EN','BEGIN:VEVENT',
    'UID:lifetime-'+Date.now()+'@gamesbyvidal.github.io','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',
    'DTSTART:'+local(start),'DTEND:'+local(end),'RRULE:FREQ=DAILY','SUMMARY:'+title,'DESCRIPTION:'+details,'URL:'+url,
    'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+title,'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  a.download = 'lifetime-reminder.ics';
  document.body.appendChild(a); a.click(); a.remove();
}

function modal(inner, cls){
  const m = document.createElement('div');
  m.className = 'modal' + (cls ? ' ' + cls : '');
  m.innerHTML = '<div class="card">'+inner+'</div>';
  m.onclick = ev => { if (ev.target === m || ev.target.hasAttribute('data-close')) m.remove(); };
  document.body.appendChild(m);
}

function confetti(set){
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = pick(set);
    c.style.left = Math.random()*100 + 'vw';
    c.style.animationDuration = (1.8 + Math.random()*1.6) + 's';
    c.style.animationDelay = Math.random()*0.5 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

document.querySelectorAll('.nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0,0); });
catchUp();
render();
updateIcon();
window.addEventListener('hashchange', render);
// If the app sat open overnight, catch up when it comes back on screen.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S) { catchUp(); render(); } });
</script>
</body>
</html>
